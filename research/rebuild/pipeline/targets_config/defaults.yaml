# Defaults: what every year gets, historical or projected, unless the year's own file drops an entry or overrides
# it (by id, with a reason). TARGETS.md section 12.
#
# Inheritance: years/<year>.yaml -> historical.yaml or projection.yaml -> this file. Two layers only: a year never
# inherits from another year. target_list.resolve(year) writes out the resolved configuration (every entry, the
# file it came from, and each field a later file overrode, with the reason), so nobody follows the chain by hand.
#
# The floor of section 6 (every variable of the file gets a count of holders and a dollar total wherever a source
# with a matching concept exists) belongs here. It is not built yet: today's 383 targets have no floor, and the
# value source it needs for a year with nothing published ("held at the latest year's rate per unit in each
# demographic cell") needs a finished earlier year. Until then this file has no target entries.

targets: []

# What every run reports (TARGETS.md section 14; report_tilt.py writes it).
report:
  - every target with its value, standard error, where the file lands, and the miss in standard errors
  - thin cells, the effective records behind each target and the largest weight factor
  - published numbers not targeted (SOI Table 1.7, dependent filers, today) and the file's miss on each
  - untargeted statistics before and after the tilt, largest moves first
  - each trained model's value on untargeted statistics
  - the year's resolved configuration and its expanded target list (targets.csv), the code commit, the vintages read
