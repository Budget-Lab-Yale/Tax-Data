# 2019: the 383 targets of the 24 October run (tilt/seed20261016, tilt/seed20261017), plus Table 1.7 (24 October)
# and the S2 targets at the top (25 October: the five top AGI brackets with their composition, the SCF's 99.9th
# percentile line and the top net worth by kind of asset).
#
# What the year adds, drops or overrides relative to historical.yaml, each with its reason. Every target's value is
# 2019's: SOI 2019 Tables 1.4, 1.2 and 1.6, the SCF waves of the prior below (the 2019 wave, income of 2018, wealth
# at interview, pooled with the 2022 and 2016 waves grown to it per tax unit; scf_targets.py), the 2019 CEX, and the
# CPS filing stage's 2019 non-filers.

year: 2019
kind: historical
inherits: historical

# The prior the generated file is drawn under (TARGETS.md section 7). Generation reads the "balance sheet" entry
# (generate.py, scf_waves): each record is given one SCF wave at random with these shares, its balance sheet drawn
# under the SCF label at that wave's income year, its dollars from that wave's own records grown per tax unit to the
# 2019 wave. The SCF targets are computed on the same waves with the same shares (scf_targets.py, settings
# tilt.scf_target_waves). The other entries are only recorded: generation draws the PUF variables under the PUF 2015 label, and
# consumption and the CPS items at 2019 (settings cex and cps, generation_year).
# Section 7's rule for 2019: weights exp(-|2019 - t| / 2) over the waves' income years t = 2021, 2018, 2015, 2012
# give 0.3679, 0.6065, 0.1353, 0.0302; as shares of their sum 32.3%, 53.2%, 11.9%, 2.6%; the 2013 wave (2.6%) is
# under 5% and dropped; the other three rescaled to 54.65%, 33.15%, 12.20% (exactly 0.546549, 0.331499, 0.121952;
# rounded so they sum to 1).
prior:
  puf variables: {puf 2015: 1.0}
  balance sheet: {scf 2019: 0.5465, scf 2022: 0.3315, scf 2016: 0.1220}
  consumption: {cex 2019: 1.0}
  cps items: {cps 2019: 1.0}

targets:
  - id: business
    variable: [rent_royalty_net_income, rent_royalty_net_loss, farm_net_income, farm_net_loss,
               farm_rental_net_income, farm_rental_net_loss]
    override: >-
      estates and trusts are left out, as on 22 and 24 October: their tiny cells could not always be met (with
      standard errors they could come back, giving way where they conflict)

  # Tips (27 October, candidate): SOI's Form W-2 statistics for 2019, Table 4.B, box 7 (Social Security tips),
  # returns with any and the amount, in joint and non-joint returns. SOI publishes no tips by size of wages. The
  # file's tips are measured as box 7 has them (catalog ss_tips: held to the Social Security wage base). Returns other
  # than dependent filers': the non-joint value is SOI's less the SIPP 2019's share of dependents among non-joint
  # tipped people (count) or tips (amount), and half that reduction is added to the error (catalog source soi w2).
  # Only 2019 and 2020 have this layout of the W-2 tables (settings paths.raw.soi_w2), so the entry is the year's own.
  - id: tips_w2
    kind: tips
    statistic: [count, amount]
    population: independent_filers
    variable: ss_tips
    cells: {joint_or_not: all}
    value: {published: soi w2}
    error: {kind: soi_borrowed}
    key: {group: '{cell} returns', target: '{variable} {statistic}'}
