    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: itemized_medical
    cells: {itemized_agi_groups: all}
    value: {published: soi 2.1}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  - id: calc_itemized_taxes
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: itemized_taxes
    cells: {itemized_agi_groups: all}
    value: {published: soi 2.1}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  - id: calc_itemized_interest
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: itemized_interest
    cells: {itemized_agi_groups: all}
    value: {published: soi 2.1}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # (autoresearch, 4 November) Table 2.1's cash gifts and gifts other than cash on itemizing returns, as reported
  # (before the deduction's limits). The deduction itself is the next entry; its split was free, and run3's 2019
