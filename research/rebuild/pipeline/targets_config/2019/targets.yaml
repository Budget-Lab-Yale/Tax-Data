  - id: calc_eitc
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: eitc
    cells: {eitc_agi_groups: all}
    value: {published: soi 3.3}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
  - id: calc_amt
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: alternative_minimum_tax
    cells: {amt_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

