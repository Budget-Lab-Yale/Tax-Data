# 2019: the targets of the year's file, written out in full (TARGETS.md section 12). Nothing is inherited: this
# file, prior.yaml and growth.yaml in this folder are the whole of the year's configuration, with the catalog
# (targets_config/catalog.yaml), which says what the words mean. A new year starts as a copy of the nearest year's
# folder; config_overview.py writes the table of every setting by year (OVERVIEW.md), marking what differs from the
# neighbouring year. Until 29 October this year was years/2019.yaml on top of historical.yaml and defaults.yaml; this
# file is what they resolved to, with each entry's comment kept (target_list.resolve checks every entry has a value
# source the catalog defines, and growth.check every dollar item a growth line, before any run).
#
# The 383 targets of the 24 October run (tilt/seed20261016, tilt/seed20261017), Table 1.7 (24 October), the S2 targets
# at the top (25 October: the five top AGI brackets with their composition, the SCF's 99.9th percentile line and the
# top net worth by kind of asset), and the later additions dated in their comments. Every target's value is 2019's:
# SOI 2019 Tables 1.2, 1.3, 1.4, 1.6, 1.7 and 4.3 and the W-2 statistics, the SCF waves of the prior (prior.yaml; the
# 2019 wave, income of 2018, wealth at interview, pooled with the 2022 and 2016 waves grown to it per tax unit;
# scf_targets.py), the CEX and CPS years of the prior, and the CPS filing stage's 2019 non-filers.
#
# Each entry is a block of targets: every statistic x every variable x every cell. It states the parts of
# TARGETS.md section 2 in full words: statistic, population, variable, cells, value (where it comes from) and error
# (its kind, TARGETS.md section 9). "key" gives the strings that name each target, (kind, group, target), the same
# strings as the tilt's fit.csv; in a key, {cell} is the cell's label, {<grouping>} the label of that grouping's
# part of the cell, {variable} the variable's short name, {label} its label, {statistic} the statistic and {year}
# the year of the value. A value's year is the target year unless the entry says otherwise.
#
# reason: why an entry is as it is in this year where it departs from the general rule (it fills targets.csv's reason
# column; before 29 October, the override reason of the year file).

#
# Run of 30 October (installed networks, scratch explore/2026-10-30/targets/run/2019): 805 targets after expansion, every one inside its range; effective sample kept 80.0%. No block dropped.
year: 2019
kind: historical

# What every run reports (TARGETS.md section 14; report_tilt.py writes it).
report:
  - every target with its value, standard error, where the file lands, and the miss in standard errors
  - thin cells, the effective records behind each target and the largest weight factor
  - published numbers not targeted (SOI Table 1.7, dependent filers, today) and the file's miss on each
  - untargeted statistics before and after the tilt, largest moves first
  - each trained model's value on untargeted statistics
  - the year's resolved configuration and its expanded target list (targets.csv), the code commit, the vintages read

targets:

  # SOI Table 1.4 by AGI bracket: the number of returns, and the number with and the amount of the four income
  # items. Filers only. The five top brackets are each their own cell (soi_agi_brackets, kept_separate), so these
  # two entries give the returns and the income composition of each top bracket (TARGETS.md S2).
  - id: irs_returns
    kind: IRS
    statistic: units
    population: filers
    cells: {standard_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: returns}

  - id: irs_wages
    kind: IRS
    statistic: [count, amount]
    population: filers
    variable: income_items_standard
    cells: {standard_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  - id: irs_income_items_broad
    kind: IRS
    statistic: [count, amount]
    population: filers
    variable: income_items_broad
    cells: {business_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # Joint returns (married filing jointly and surviving spouses), all AGI, from Table 1.2.
  - id: joint_returns
    kind: IRS
    statistic: units
    population: filers
    cells: {joint_or_not: [joint]}
    value: {published: soi 1.2}
    error: {kind: soi_borrowed}
    key: {group: all, target: joint returns}

  # The number of non-filer units, the CPS filing stage's expected non-filers. With the returns it fixes the number
  # of units in the file, which every share and average condition is written against (target_list.average_condition).
  - id: non_filers
    kind: non-filers
    statistic: units
    population: non_filers
    cells: all
    value: {pipeline: filing_stage}
    error:
      kind: identity
      reason: >-
        it defines the non-filer population: the file's non-filers are the CPS filing stage's non-filers, and with
        SOI's returns this count is the number of units every share and average is written against
    key: {group: all, target: non-filers}

  # The people in non-filer units, counted on the CPS units of the filing stage by the file's own rule (heads and
  # spouses by their own age, children among the head, spouse and three dependents the file carries). The
  # calibration's numbers by the head's band (Census adults less the adults on SOI returns less claimed dependents;
  # Census children under 17 not on returns) are kept as a check, in each target's source.
  - id: nonfiler_people
    kind: non-filer people
    statistic: amount
    population: non_filers
    variable: nonfiler_people
    cells: all
    value: {pipeline: filing_stage}
    error:
      kind: judgment
      relative: 0.02
      reason: >-
        today's fallback tolerance; the true error is likely larger in the youngest band, where the value is a
        small difference of large numbers (2019, 18-25: 33.8 million adults less 24.7 million on returns less 8.1
        million claimed dependents)
    key: {group: 'non-filers, {label}', target: people}

  # (autoresearch, round 9) Non-filers' dividends, against the non-filers of the pipeline's own tax data, with a wide
  # error: the CPS-label draw puts large dividends on non-filers the source does not have (run3's 2019 file $30.0 billion
  # on 3.1 million non-filers, $13.8 billion of it on 46,000 units with $100,000 or more, against $7.1 billion on 2.1
  # million in the source; 2023 $51 billion against $7.7 billion). The source is before the fill-in of holders the CPS
  # misses, so the error is half the value (amount) and a quarter (holders).
  - id: nonfiler_dividends
    kind: non-filer items
    statistic: amount
    population: non_filers
    variable: ordinary_dividends
    cells: all
    value: {pipeline: tax_data_nonfilers}
    error: {kind: judgment, relative: 0.5, reason: 'the source is before the fill-in of the dividend holders the CPS misses'}
    key: {group: all, target: 'non-filers, {variable} {statistic}'}

  - id: nonfiler_dividend_holders
    kind: non-filer items
    statistic: count
    population: non_filers
    variable: ordinary_dividends
    cells: all
    value: {pipeline: tax_data_nonfilers}
    error: {kind: judgment, relative: 0.25, reason: 'the source is before the fill-in of the dividend holders the CPS misses'}
    key: {group: all, target: 'non-filers, {variable} {statistic}'}

  # SOI Table 1.7: dependent filers' returns by AGI bracket. Dependent filers are real returns, counted in every SOI
  # table (TARGETS.md section 10), but nothing else fixes how many there are, so the tilt could fill the Table 1.6
  # age counts with them: in the first run with consumption hit exactly (24 October) they rose from 9.85 to 21.92
  # million (SOI: 9.55 million). Section 6 had found they need a target of their own.
  - id: dependent_filer_returns
    kind: dependent filers
    statistic: units
    population: dependent_filers
    cells: {dependent_agi_groups: all}
    value: {published: soi 1.7}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: returns}

  # (2 November 2026, John; explore/2026-11-02/dependent_filers/RESULTS.md) More of Table 1.7: dependent filers' net
  # capital gain (Table 1.7's "sales of capital assets, taxable net gain", Form 1040's capital gain line where
  # positive, as for Table 1.3's net gain), all AGI; and their returns and net capital gain in Table 1.7's two top
  # brackets, $50,000 under $200,000 and $200,000 or more. Dependent filers are outside Table 4.3 and the SCF targets,
  # and the one returns cell above $20,000 did not limit how far the reweighting raised those with large AGI: in the
  # run of 1 November 2026 the 2023 file had $10.7 billion of their net gain against SOI's $1.7 billion. Errors are
  # borrowed from Table 1.4 as for the returns above: a count by its number of returns, an amount by its amount and
  # its number of returns with a gain (errors.py).
  - id: dependent_filer_gains
    kind: dependent filers
    statistic: amount
    population: dependent_filers
    variable: capital_gain_positive
    cells: all
    value: {published: soi 1.7}
    error: {kind: soi_borrowed}
    key: {group: all, target: net capital gain}

  # (autoresearch, 4 November) Dependent filers' taxable interest and ordinary dividends, Table 1.7, all AGI
  # (round 7: also their tax-exempt interest, capital gain distributions, capital losses and Schedule C income and loss).
  # Untargeted in run3, the 2019 file had $2.1 billion of their taxable interest against SOI's $0.38 billion and
  # $3.2 billion of their dividends against $2.2 billion (2023: $2.6 against $0.69 billion of interest); this income
  # is what the tax on a child's unearned income falls on.
  - id: dependent_filer_investment_income
    kind: dependent filers
    statistic: [count, amount]
    population: dependent_filers
    variable: [taxable_interest, ordinary_dividends, exempt_int, capital_gain_distributions, capital_gain_loss,
               sole_prop_net_income, sole_prop_net_loss]
    cells: all
    value: {published: soi 1.7}
    error: {kind: soi_borrowed}
    key: {group: all, target: '{variable} {statistic}'}

  - id: dependent_filer_returns_top
    kind: dependent filers
    statistic: units
    population: dependent_filers
    cells: {dependent_agi_top_groups: all}
    value: {published: soi 1.7}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: returns}

  - id: dependent_filer_gains_top
    kind: dependent filers
    statistic: amount
    population: dependent_filers
    variable: capital_gain_positive
    cells: {dependent_agi_top_groups: all}
    value: {published: soi 1.7}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: net capital gain}

  # SOI Table 1.6: returns by the primary filer's age range, 26-34 to 65+, in joint and non-joint returns. Under 26
  # is not a target of its own: the bracket returns and the joint count leave it, and a sixth target would repeat
  # them. Table 1.6 counts a dependent filer's return under its own age (TARGETS.md section 10).
  - id: age_returns
    kind: age
    statistic: units
    population: filers
    cells: {joint_or_not: all, adult_age_ranges: [26-34, 35-44, 45-54, 55-64, 65+]}
    value: {published: soi 1.6}
    dependent_filers: >-
      under 26 in the under-26 range; 26 and over (the file has no exact age for them) spread over the five ranges
      26 and over in proportion to this entry's own values in their filing status
    error: {kind: soi_borrowed}
    key: {group: '{joint_or_not}, primary {adult_age_ranges}', target: returns}

  # (autoresearch, round 8) SOI Table 1.2: returns of single filers, married people filing separately and heads of
  # household in each group of the standard AGI grid (joint returns follow from these, Table 1.4's returns and the joint
  # total). Untargeted, run3's 2019 file had 0.63-0.70 of SOI's single returns at AGI $1-10 million and 1.8 times its
  # joint returns at $10,000-15,000. Errors borrowed as for Table 1.6 by AGI (Table 1.4's count cells in the same group).
  - id: status_returns_by_agi
    kind: status by AGI
    statistic: units
    population: filers
    cells: {filing_four: [single, separate, head of household], standard_agi_groups: all}
    value: {published: soi 1.2}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: returns}

  # (autoresearch, 4 November) SOI Table 1.6: returns of heads of household and of married people filing separately
  # by the primary filer's age range, all six ranges, all AGI. The entry above leaves the split of non-joint returns
  # between single filers and heads of household free within each age, and the draw puts heads of household too young:
  # run3's 2019 file had 4.06 million heads of household under 26 against SOI's 3.46 million, and 8.80 million aged
  # 45-54 against 9.79 million (2023: 4.35 against 3.06 million under 26). With the entry above and Table 1.3's
  # returns by status these also fix single filers by age. Dependent filers are not heads of household; the few
  # married dependent filers filing separately are left out of these cells (the file has no exact age for them).
  - id: age_returns_by_status
    kind: age by status
    statistic: units
    population: filers
    cells: {filing_four: [separate, head of household], adult_age_ranges: all}
    value: {published: soi 1.6}
    error: {kind: soi_borrowed}
    key: {group: '{filing_four}, primary {adult_age_ranges}', target: returns}

  # (3 November 2026, John; explore/2026-11-03/age_by_agi/RESULTS.md) SOI Table 1.6 by AGI: returns by the primary
  # filer's age range, 26-34 to 65+, within each group of the standard AGI grid, from the table's All returns panel.
  # The totals by age above leave the age mix within AGI free, and the SCF's wealth by age (2 November) moved
  # high-income returns from primaries under 55 to 55-64: in 2015's $2m-5m class, 22% with a primary aged 45-54
  # against SOI's 30%. Summed over AGI these cells are the totals by age above (joint plus non-joint, to a few
  # returns), so the two entries agree; both are kept, because the demographic prescaling uses the totals (kind
  # age) and this entry is a kind of its own. Under 26 is not a target, as above. Errors borrowed by number of
  # returns from Table 1.4's count cells in the same AGI group (John, 3 November), except in the $10m-and-over group,
  # which SOI samples in full (errors.py).
  - id: age_returns_by_agi
    kind: age by AGI
    statistic: units
    population: filers
    cells: {standard_agi_groups: all, adult_age_ranges: [26-34, 35-44, 45-54, 55-64, 65+]}
    value: {published: soi 1.6}
    dependent_filers: >-
      under 26 in the under-26 range; 26 and over (the file has no exact age for them) spread over the five ranges
      26 and over in proportion to this entry's own values in the same AGI group
    error: {kind: soi_borrowed}
    key: {group: 'all returns, {standard_agi_groups}, primary {adult_age_ranges}', target: returns}

  # Business income: each family's net income and net loss, returns and dollars, in six AGI groups (merged where
  # SOI's published cells cross a group edge). Schedule C and partnership and S corporation income are in
  # business_top instead, the same five groups below $1M and SOI's five top brackets above it.
  # In 2019 (since 22 October) estates and trusts are left out: the family list business_other less estate_trust.
  # (autoresearch, 4 November) estates and trusts back, and Form 4797's gain and loss added: with standard errors
  # (the one-cost rule of 1 November) a cell that conflicts gives way instead of stopping the solve. In run3's 2019
  # file, untargeted, estate and trust net income was $51.9 billion against SOI's $36.2 billion ($6.5 billion at no
  # AGI against $0.5 billion), Form 4797 net gain $56.3 billion against $37.9 billion and net loss $52.3 billion
  # against $18.5 billion.
  - id: business
    kind: business
    statistic: [count, amount]
    population: filers
    variable: [rent_royalty_net_income, rent_royalty_net_loss, estate_trust_net_income, estate_trust_net_loss,
               other_gains_net_gain, other_gains_net_loss]
    cells: {business_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
    reason: >-
      variable: estates and trusts, left out on 22 and 24 October because their tiny cells could not always be met,
      are back under standard errors (autoresearch, 4 November), with Form 4797's gain and loss

  # (autoresearch, 4 November) Taxable state income tax refunds, Table 1.4, in the six business AGI groups. The
  # tax benefit rule (settings taxes.refund_tax_benefit) takes the refunds off itemizers whose taxes paid exceed the
  # cap by more than the refund; on its own it left too few (2019: $2.3 billion on 3.0 million returns against SOI's
  # $5.6 billion on 4.3 million), because the reweighting cuts the 2015 itemizers who carry them and because some
  # refunds repay taxes deducted before the cap. Round 3: the rule alone left too few refunds at the top to meet the
  # $1 million and over cell (2019: $0.27 billion against SOI's $0.66 billion); settings taxes.refund_reported_anyway
  # keeps a share of the refunds the rule would take off.
  - id: state_refunds
    kind: IRS
    statistic: [count, amount]
    population: filers
    variable: state_ref
    cells: {business_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # (autoresearch, round 7) More of Table 1.4 in the business AGI groups: statutory adjustments, tax-exempt interest,
  # unemployment compensation, taxable IRA distributions and taxable pensions. After round 6 these were the
  # untargeted Table 1.4 lines with the most cells beyond 3 standard errors (2023 statutory adjustments: 41.6 million
  # returns in run3's file against SOI's 35.8 million; 2019 tax-exempt interest at $5-10 million $4.3 billion against
  # $3.0 billion).
  - id: irs_more_items
    kind: IRS
    statistic: [count, amount]
    population: filers
    variable: [statutory_adjustments, exempt_int, ui, txbl_ira_dist, txbl_pens_dist, total_pensions]
    cells: {business_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # (autoresearch, 4 November) Alimony received and paid, Table 1.4, all AGI. The draw carries 2015's alimony into
  # every year; the 2017 law ends the inclusion and the deduction for divorces from 2019, so the payments run off
  # (SOI: 344,000 returns with alimony received in 2019, 184,000 in 2023; run3's files 538,000 and 577,000).
  - id: alimony
    kind: IRS
    statistic: [count, amount]
    population: filers
    variable: [alimony, alimony_paid]
    cells: all
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: all, target: '{variable} {statistic}'}

  # Farm and farm rental income (1 November, decision 71): one overall target each, net income and net loss, returns and
  # dollars, no AGI groups; the cells by AGI group held 1,200 to 140,000 returns.
  - id: business_farm
    kind: business
    statistic: [count, amount]
    population: filers
    variable: [farm_net_income, farm_net_loss, farm_rental_net_income, farm_rental_net_loss]
    cells: all
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: all, target: '{variable} {statistic}'}

  # Schedule C and partnership and S corporation income, net income and net loss, returns and dollars: the six
  # groups of the entry above with "$1m and over" cut into $1M-1.5M, $1.5M-2M, $2M-5M, $5M-10M and $10M and over
  # (TARGETS.md S2: the composition of each top bracket).
  - id: business_top
    kind: business
    statistic: [count, amount]
    population: filers
    variable: business_top
    cells: {business_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # The SCF targets' population is the SCF's units below $1 billion of net worth (29 October, PLAN.md step 10 of
  # explore/2026-10-29/top_research; catalog population scf_units_below_a_billion): amounts, shares, the income x net
  # worth grid, the percentile lines and their standard errors all on that population, in the SCF and in the file. The
  # Forbes list supplies the units above (top_billionaires.py). The restricted SCF is not scaled back up to its full count.
  # Every SCF target (kinds wealth and wealth grid) is computed on the year's mix of SCF waves, the year file's prior
  # "balance sheet", each wave's balance sheet grown per tax unit to the target year's wave, each wave with its own
  # lines; value = sum of share x the wave's value, variance = sum of share^2 x the wave's variance (scf_targets.py,
  # TARGETS.md S9). Their ranges are half a standard error (settings tilt.range_in_se_by_kind).
  # SCF wealth: the share of units above the SCF's 99.9th, 99th, 90th and 50th
  # percentile lines and above $1 million, and net worth above each percentile line and in total. Among units other
  # than dependent filers, who hold no wealth in the file.
  - id: wealth_shares
    kind: wealth
    statistic: share
    population: scf_units_below_a_billion
    variable: net_worth
    cells: {scf_net_worth_lines: all}
    value: {survey: scf}
    error: {kind: survey_replicate}
    key: {group: '{cell}', target: share of units}

  - id: wealth_dollars
    kind: wealth
    statistic: amount
    population: scf_units_below_a_billion
    variable: net_worth
    cells: [{scf_net_worth_lines: [above the SCF 99.9th percentile, above the SCF 99th percentile,
                                   above the SCF 90th percentile, above the SCF 50th percentile]}, all]
    value: {survey: scf}
    error: {kind: survey_replicate}
    key: {group: '{cell}', target: '{variable}'}

  # SCF top wealth by kind of asset (TARGETS.md S2): the dollars of stocks, business equity, real estate and
  # retirement accounts held by the units above the SCF's 99.9th, 99th and 90th percentile net worth lines (the
  # lines on net worth, the amounts of the asset). The same columns on both sides (catalog variables).
  - id: wealth_by_asset
    kind: wealth
    statistic: amount
    population: scf_units_below_a_billion
    variable: scf_top_assets
    cells: {scf_net_worth_lines: [above the SCF 99.9th percentile, above the SCF 99th percentile,
                                  above the SCF 90th percentile]}
    value: {survey: scf}
    error: {kind: survey_replicate}
    key: {group: '{cell}', target: '{variable}'}

  # The income x net worth grid (26 October; TARGETS.md S9, HISTORY.md). Four income groups
  # (below p90, p90-99, p99-99.9, p99.9+ of the seven shared income items, each side's own percentiles) by four net worth classes (below the SCF's p90 line,
  # p90-99, p99-99.9, above p99.9, the SCF's dollar lines). In each cell: the share of the income group's units in
  # the net worth class (the count of units, stated within the income group, whose size is fixed by rank on both
  # sides), and the class's net worth in the group (dollars). The share of the lowest class is left out in each
  # income group: it is one minus the others exactly.
  # Thin cells merged (a cell resting on fewer than 10 SCF households of the 2019 wave, in any implicate, is merged
  # into the next richer net worth class of the same income group until it has 10 or more; counted before the waves
  # were pooled, which roughly triples each cell's households, and kept since):
  #   income p99-99.9: below p90 (3 households) + p90-99 (132) -> at or below p99 (135);
  #   income p99.9+: below p90 (0) + p90-99 (7) + p99-99.9 (83) -> at or below p99.9 (86: a household can sit in
  #   different cells in different implicates, so the merged count is not the sum).
  - id: wealth_grid_shares
    kind: wealth grid
    statistic: share
    population: scf_units_below_a_billion
    variable: net_worth
    cells:
      - {scf_net_worth_classes: [net worth SCF p90-99, net worth SCF p99-99.9, net worth above SCF p99.9],
         income_rank_groups: [income below p90, income p90-99]}
      - {scf_net_worth_classes: [net worth SCF p99-99.9, net worth above SCF p99.9],
         income_rank_groups: [income p99-99.9]}
      - {scf_net_worth_classes: [net worth above SCF p99.9], income_rank_groups: [income p99.9+]}
    value: {survey: scf}
    error: {kind: survey_replicate}
    key: {group: '{scf_net_worth_classes}, {income_rank_groups}', target: share of the income group's units}

  - id: wealth_grid_dollars
    kind: wealth grid
    statistic: amount
    population: scf_units_below_a_billion
    variable: net_worth
    cells:
      - {scf_net_worth_classes: [net worth below SCF p90, net worth SCF p90-99, net worth SCF p99-99.9,
                                 net worth above SCF p99.9],
         income_rank_groups: [income below p90, income p90-99]}
      - {scf_net_worth_classes: [net worth at or below SCF p99, net worth SCF p99-99.9, net worth above SCF p99.9],
         income_rank_groups: [income p99-99.9]}
      - {scf_net_worth_classes: [net worth at or below SCF p99.9, net worth above SCF p99.9],
         income_rank_groups: [income p99.9+]}
    value: {survey: scf}
    error: {kind: survey_replicate}
    key: {group: '{scf_net_worth_classes}, {income_rank_groups}', target: net worth}

  # CEX consumption: each category's average per unit, over all units and in the 12 cells of the primary filer's
  # adult age range by married or not. The overall averages are kept because the cells do not imply them: the
  # file's units fall into the cells in other shares than the CEX's.
  - id: consumption_all
    kind: consumption
    statistic: average
    population: units_other_than_dependent_filers
    variable: consumption
    cells: all
    value: {survey: cex}
    error: {kind: survey_replicate}
    key: {group: 'CEX {year}, all', target: '{variable}, average'}

  - id: consumption_by_age_and_married
    kind: consumption
    statistic: average
    population: units_other_than_dependent_filers
    variable: consumption
    cells: {adult_age_ranges: all, married_or_not: all}
    value: {survey: cex}
    error: {kind: survey_replicate}
    key: {group: 'CEX {year}, age {adult_age_ranges}, {married_or_not}', target: '{variable}, average'}

  # SOI Table 1.3 (27 October; run G2 of explore_targets_13_43_RESULTS.md, approved by John): returns, and the
  # number with and the amount of 22 income items (AGI its amount only), in each of the four filing statuses. Filers
  # (dependent filers included, as SOI counts them). Errors borrowed from the nearest Table 1.4 cells.
  - id: soi_1_3_returns
    kind: soi 1.3
    statistic: units
    population: filers
    cells: {filing_four: all}
    value: {published: soi 1.3}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: returns}

  - id: soi_1_3_agi
    kind: soi 1.3
    statistic: amount
    population: filers
    variable: agi
    cells: {filing_four: all}
    value: {published: soi 1.3}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  - id: soi_1_3_items
    kind: soi 1.3
    statistic: [count, amount]
    population: filers
    variable: soi_1_3_items
    cells: {filing_four: [single, joint, head of household]}
    value: {published: soi 1.3}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # SOI Table 4.3 (27 October; run G2): returns, AGI, and the number with and the amount of eight income items, in the
  # top 0.001%, the top 0.01%, the top 0.1% and the top 1% of AGI. Returns other than dependent filers' with AGI at
  # or above SOI's published cutoff for the group and year (3 November, John; before, the file's own percentile lines
  # on its starting weights), held fixed through the tilt, so the count of returns above each cutoff is a target the
  # weights must meet (its error as the other counts: borrowed from Table 1.4's cells, or 1% of the value where the
  # cutoff is $10 million or more). The top 0.001% was folded
  # into the top 0.01% from 26 October (John) because the file lacked the PUF's aggregate records; it is restored with
  # them (29 October, PLAN.md Part A step 9: top_hidden.py rebuilds them), and expand must keep it (must_reach). With
  # settings tilt.top.enabled false, expand leaves the must_reach cells out, as before 29 October.
  - id: soi_4_3_returns
    kind: soi 4.3
    statistic: units
    population: independent_filers
    cells: {agi_cumulative: [top 0.001 percent, top 0.01 percent, top 0.1 percent, top 1 percent]}
    must_reach: [top 0.001 percent]
    value: {published: soi 4.3}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: returns}

  - id: soi_4_3_agi
    kind: soi 4.3
    statistic: amount
    population: independent_filers
    variable: agi
    cells: {agi_cumulative: [top 0.001 percent, top 0.01 percent, top 0.1 percent, top 1 percent]}
    must_reach: [top 0.001 percent]
    value: {published: soi 4.3}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  - id: soi_4_3_items
    kind: soi 4.3
    statistic: [count, amount]
    population: independent_filers
    variable: soi_4_3_items
    cells: {agi_cumulative: [top 0.001 percent, top 0.01 percent, top 0.1 percent, top 1 percent]}
    must_reach: [top 0.001 percent]
    value: {published: soi 4.3}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # (autoresearch, 4 November) Table 4.3's deductions in the top AGI groups, from the calculator: the charitable
  # and interest deductions and the QBI deduction, dollars only. Table 2.1's top group is $500,000 and over and
  # Table 1.4's QBI cells stop at $10 million, so the very top was free: run3's 2019 file had 1.42 times SOI's
  # contributions deduction in the top 0.001% and 0.52 times its interest deduction, and 0.28 times its QBI deduction.
  # (round 6) Only the top 0.1% and 1%: in 2023 the top 0.001% and 0.01% cells, where the Forbes list's records are
  # held at their weight, could not be met and the solve ran out of its 150 Newton steps (round 5).
  # Table 4.3's taxes paid deduction is left out: it adds taxes other than state and local (in 2019 the top 0.001%
  # deducted $191 million, $129,000 a return, under a $10,000 cap on state and local taxes), which the calculator's
  # claimed taxes do not hold; as a target it stopped the solve (round 5, 271 standard errors).
  - id: soi_4_3_deductions
    kind: calculator
    statistic: amount
    population: independent_filers
    variable: [itemized_charity, itemized_interest, qbi_deduction]
    cells: {agi_cumulative: [top 0.1 percent, top 1 percent]}
    value: {published: soi 4.3}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # (autoresearch, round 6) Qualified dividends in Table 4.3's top 0.1% and 1%: with ordinary dividends met, run3's
  # 2019 file had 1.48 times SOI's qualified dividends in the top 0.1% before the tilt.
  - id: soi_4_3_qualified_dividends
    kind: soi 4.3
    statistic: [count, amount]
    population: independent_filers
    variable: qualified_dividends
    cells: {agi_cumulative: [top 0.1 percent, top 1 percent]}
    value: {published: soi 4.3}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # Auto loan interest from the SCF (27 October, candidate): in the four income groups of the wealth grid, the share
  # of the group's units with any auto loan interest and its dollars per unit, on the year's mix of SCF waves
  # (scf_targets.py), each wave's amounts grown per tax unit to the target year's wave. Stated per unit, not as
  # totals: the SCF's units add to 162.76 million in 2019, the file's units other than dependent filers to about
  # 169.5 million, and the dollars per unit are what carries over (TARGETS.md S9). Half a standard error, as the
  # other SCF targets (settings tilt.range_in_se_by_kind).
  - id: auto_loans
    kind: auto loans
    statistic: average
    population: scf_units_below_a_billion
    variable: auto_loans
    cells: {income_rank_groups: all}
    value: {survey: scf}
    error: {kind: survey_replicate}
    key: {group: '{income_rank_groups}', target: '{variable}, average'}

  # ---- entries of 2019 alone until 29 October (years/2019.yaml) -------------------------------------------------
  # Tips (27 October, candidate): SOI's Form W-2 statistics for 2019, Table 4.B, box 7 (Social Security tips),
  # returns with any and the amount, in joint and non-joint returns. SOI publishes no tips by size of wages. The
  # file's tips are measured as box 7 has them (catalog ss_tips: held to the Social Security wage base). Returns other
  # than dependent filers': the non-joint value is SOI's less the SIPP 2019's share of dependents among non-joint
  # tipped people (count) or tips (amount), and half that reduction is added to the error (catalog source soi w2).
  # Only 2019 and 2020 have this layout of the W-2 tables (settings paths.raw.soi_w2), so the entry is the year's own.
  - id: tips_w2
    kind: tips
    statistic: [count, amount]
    population: independent_filers
    variable: ss_tips
    cells: {joint_or_not: all}
    value: {published: soi w2}
    error: {kind: soi_borrowed}
    key: {group: '{cell} returns', target: '{variable} {statistic}'}

  # Tips spread (28 October, candidate, run S3). The tips targets above count units with tips; the file has too few
  # small tippers against the W-2 statistics. Two additions, both worker level (the primary and spouse slots, box 7
  # measure, filers other than dependent filers):
  # the number of tipped workers on joint returns (Table 4.B, taxpayers; a joint return has up to two). On non-joint
  # returns a return is one worker, so the workers there are the returns with tips of the entry above and are not
  # repeated.
  - id: tips_w2_workers
    kind: tips
    statistic: workers
    population: independent_filers
    variable: ss_tips
    cells: {joint_or_not: [joint]}
    value: {published: soi w2}
    error: {kind: soi_borrowed}
    key: {group: '{cell} returns', target: '{variable} {statistic}'}
  # and the share of tipped workers above each Table 4.C percentile line (the 10th to the 99th: 90, 75, 50, 25, 10 and
  # 1% of workers above $121, $537, $2,444, $8,409, $18,281, $44,054).
  - id: tips_w2_spread
    kind: tips
    statistic: worker share
    population: independent_filers
    variable: ss_tips
    cells: all
    percentiles: [10, 25, 50, 75, 90, 99]
    value: {published: soi w2 pctiles}
    error: {kind: soi_borrowed}
    key: {group: tipped workers, target: '{variable} workers above ${line:,.0f}'}

  # Elective deferrals (28 October; decided by John 27 October): SOI's Form W-2 statistics for 2019, Table 2.D,
  # contributions (traditional plus Roth) by AGI, in eight AGI groups (catalog w2_agi_groups): on joint returns the
  # dollars only (Table 2.D counts taxpayers, up to two on a joint return, and the file's counts are of returns); on
  # non-joint returns the returns with any and the dollars. The file's deferrals are each person's after the legal
  # limit and their own wages (catalog w2_elective_deferrals). Returns other than dependent filers': the non-joint
  # values are reduced by the SIPP's dependent share and half the reduction is added to the error (catalog source
  # soi w2 2.d). Only 2019 and 2020 have this layout of the W-2 tables, so the entries are the year's own.
  - id: deferrals_w2_joint
    kind: deferrals
    statistic: amount
    population: independent_filers
    variable: w2_elective_deferrals
    cells: {w2_agi_groups: all, joint_or_not: [joint]}
    value: {published: soi w2 2.d}
    error: {kind: soi_borrowed}
    key: {group: '{cell} returns', target: '{variable} {statistic}'}
  - id: deferrals_w2_nonjoint
    kind: deferrals
    statistic: [count, amount]
    population: independent_filers
    variable: w2_elective_deferrals
    cells: {w2_agi_groups: all, joint_or_not: [non-joint]}
    value: {published: soi w2 2.d}
    error: {kind: soi_borrowed}
    key: {group: '{cell} returns', target: '{variable} {statistic}'}

  # Overtime pay (28 October; decided by John 27 October, so overtime does not drift): from the CPS's own tax units,
  # as the CEX consumption targets are. The share of units with any overtime pay and overtime dollars per unit
  # (the catalog's variable list "overtime": any_ot, ot), over all units and in four groups of the unit's wages
  # (catalog wage_groups_4, since 29 October: wage_groups_5 with $100,000-200,000 and $200,000 and over merged, John
  # 28 October): 10 targets. The file's ot is ot1 + ot2, each person's held to their wages less their
  # tips (dollars.py); the CPS's is Tedeschi's rules per person (overtime_cps.R), held to the person's own wages.
  # Universe: overtime is known only for the units asked the earnings questions (months 4 and 8 of the main sample;
  # the rest have it missing), so each average is over the asked units in the cell, with their own weights
  # (target_list.cps_overtime_units). Population: units other than dependent filers, the rule of every survey target
  # (the CPS folds dependent filers into the unit that claims them; the file's dependent filers hold no CPS item).
  # Value: the CPS year mix of the prior's "cps items" (2019 73.11%, 2017 26.89%), the 2017 units' overtime and wages
  # grown to 2019 by SOI's wages per return (survey_mix.py). Error: the ASEC's 160 replicate weights
  # (errors.overtime_errors).
  - id: overtime_all
    kind: overtime
    statistic: average
    population: units_other_than_dependent_filers
    variable: overtime
    cells: all
    value: {survey: cps}
    error: {kind: survey_replicate}
    key: {group: 'CPS {year}, all', target: '{variable}, average'}
  - id: overtime_by_wages
    kind: overtime
    statistic: average
    population: units_other_than_dependent_filers
    variable: overtime
    cells: {wage_groups_4: all}
    value: {survey: cps}
    error: {kind: survey_replicate}
    key: {group: 'CPS {year}, {wage_groups_4}', target: '{variable}, average'}

  # Taxes computed inside the model (30 October, piece 3 of the overnight plan; taxes.py). Items the tax calculator
  # (tax-simulator-gpu under the year's law, settings taxes) computes for every record of the start, after the top of
  # the file and the non-microdata imputations and before the reweighting, joined by record id; the tilt targets them
  # like any drawn item. Filers; AGI groups by the file's own AGI, as every IRS target (the calculator's AGI differs
  # from it on some returns: capital losses past the $3,000 limit, taxable Social Security, half of self-employment
  # tax, the state tax workaround). Values: SOI Tables 1.4 and 3.3 of the year (targets.T14, T33); errors: their
  # published CVs. One entry per item, so an item can be dropped alone. To copy to another year: the lines exist in
  # Tables 1.4 and 3.3 of every year 2015-2023 except the QBI deduction (2018 on; leave calc_qbi out before 2018);
  # the child credit's lines have other names in 2015-2017 and from 2021, which targets.T33 reads too.
  - id: calc_itemizers
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: itemized_deductions_claimed
    cells: {standard_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
  - id: calc_taxable_income
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: taxable_income
    cells: {standard_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
  - id: calc_tax_before_credits
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: income_tax_before_credits
    cells: {standard_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
  # The QBI deduction by AGI (entry calc_qbi, 22 targets) is left out of 2019 (overnight rule of 30 October: with every
  # calculator entry the targets could not all be met, effective sample kept 58.4%; leaving out calc_qbi alone made
  # them feasible, 78.0%, the largest gain of any one entry; scratch explore/2026-10-30/taxes/RESULTS.md). Its counts
  # are the conflict: SOI counts returns whose deduction comes from REIT dividends and publicly traded partnerships,
  # which the file does not carry (22.2 million returns against 17.6 million at the start). The dial b still sets
  # the deduction from AGI $500,000 up to SOI's (taxes.py). To restore it, uncomment:
  # - id: calc_qbi
  #   kind: calculator
  #   statistic: [count, amount]
  #   population: filers
  #   variable: qbi_deduction
  #   cells: {calc_agi_groups: all}
  #   value: {published: soi 1.4}
  #   error: {kind: soi_cv}
  #   key: {group: '{cell}', target: '{variable} {statistic}'}
  # (autoresearch, 4 November) The QBI deduction's dollars by AGI, Table 1.4, without its counts (the counts are the
  # conflict that took the entry out on 30 October: SOI counts returns whose deduction comes from REIT dividends and
  # publicly traded partnerships, which the file does not carry). The dial b sets the deduction from AGI $500,000 up
  # in total; within it the file had too much at $500,000-1 million and too little at the top (run3's 2019 file:
  # $9.5 billion at $10 million and over against SOI's $15.3 billion; $5.7 against $8.5 billion at $5-10 million).
  - id: calc_qbi_amount
    kind: calculator
    statistic: amount
    population: filers
    variable: qbi_deduction
    cells: {calc_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  - id: calc_child_credit
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: ctc_nonrefundable
    cells: {nonref_credit_agi_groups: all}
    value: {published: soi 3.3}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
  - id: calc_child_credit_refundable
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: ctc_refundable
    cells: {ref_credit_agi_groups: all}
    value: {published: soi 3.3}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
  # (autoresearch, 4 November) Table 3.3's education credits: the draw carries 2015's claims, and the number of
  # returns claiming them fell after 2015 (run3's 2019 file: 9.18 million returns with the refundable American
  # opportunity credit against SOI's 6.94 million; 2023: 8.72 against 5.82 million)
  - id: calc_education_credits
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: [education_credit_nonrefundable, aotc_refundable]
    cells: {ref_credit_agi_groups: all}
    value: {published: soi 3.3}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
  # (autoresearch, 4 November) Table 3.3's self-employment tax, in the business AGI groups. The draw splits a
  # couple's wages and self-employment income between the spouses with too little of the CPS's pattern (in the CPS a
  # spouse with most of the wages has most of the self-employment income in 7% of such couples, in run3's 2019
  # file 12%), so more of it sits above the Social Security wage base and the tax comes out at 0.89 of SOI's.
  - id: calc_se_tax
