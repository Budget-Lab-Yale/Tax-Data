    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
  # (autoresearch, 4 November) Table 2.5: the returns with the earned income credit and its amount by the number of
  # qualifying children, all AGI. The EITC by AGI below leaves the mix of children free: run3's 2019 file had $1.5
  # billion of the credit without children against SOI's $2.3 billion, and $25.1 billion with one child against
  # $22.7 billion. Table 2.5 in the mirror stops at tax year 2020.
  - id: calc_eitc_children
