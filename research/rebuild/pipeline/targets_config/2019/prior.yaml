# 2019: the prior the year's file is drawn under (TARGETS.md section 7), written out in full. Read by generate.py
# (the balance sheet's SCF waves), survey_mix.py (the CEX, CPS and SIPP years) and scf_targets.py (the SCF targets'
# waves). Until 29 October it was the prior of years/2019.yaml.
#
# The prior the generated file is drawn under (TARGETS.md section 7). Generation reads the "balance sheet" entry
# (generate.py, scf_waves): each record is given one SCF wave at random with these shares, its balance sheet drawn
# under the SCF label at that wave's income year, its dollars from that wave's own records grown per tax unit to the
# 2019 wave. The SCF targets are computed on the same waves with the same shares (scf_targets.py). Since 28 October the "consumption", "cps items" and "sipp tips" entries are read the same
# way (generate.py, survey_mix.py): each record is given one CEX year, one CPS year and one SIPP year, each at random
# with these shares and by a generator of its own, and its CEX, CPS and SIPP phases run under that survey's label at
# that year, its dollars from that year's own records grown to 2019 (build_table.build_maps). The CEX consumption
# targets are computed on the same years with the same shares (survey_mix.py, target_list.survey_rows). The only
# entry only recorded is "puf variables": generation draws the PUF variables under the PUF 2015 label.
# Section 7's rule for the SCF in 2019: weights exp(-|2019 - t| / 2) over the waves' income years t = 2021, 2018, 2015, 2012
# give 0.3679, 0.6065, 0.1353, 0.0302; as shares of their sum 32.3%, 53.2%, 11.9%, 2.6%; the 2013 wave (2.6%) is
# under 5% and dropped; the other three rescaled to 54.65%, 33.15%, 12.20% (exactly 0.546549, 0.331499, 0.121952;
# rounded so they sum to 1).
# Section 7's rule for the CEX, CPS and SIPP in 2019 (an odd year takes its own year and the one two years before):
# weights exp(-|2019 - t| / 2) over t = 2019, 2017 give 1 and 0.3679; as shares of their sum 73.11% and 26.89%
# (exactly 0.731059, 0.268941).

year: 2019
prior:
  puf variables: {puf 2015: 1.0}
  balance sheet: {scf 2019: 0.5465, scf 2022: 0.3315, scf 2016: 0.1220}
  consumption: {cex 2019: 0.7311, cex 2017: 0.2689}
  cps items: {cps 2019: 0.7311, cps 2017: 0.2689}
  sipp tips: {sipp 2019: 0.7311, sipp 2017: 0.2689}
