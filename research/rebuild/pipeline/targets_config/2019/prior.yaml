# 2019: the prior the year's file is drawn under: the PUF year, and the SCF waves and CEX, CPS and SIPP years each
# record is drawn from, with their shares. Read by generate.py and survey_mix.py; the SCF and survey targets use the
# same waves, years and shares. Each share comes from weights exp(-|year - t| / 2) over the survey years t, those
# under 5% dropped and the rest rescaled. See TARGETS.md, "The year's mix of survey years".
# SCF shares for 2019: weights exp(-|2019 - t| / 2) over the waves' income years t = 2021, 2018, 2015, 2012 give
# 0.3679, 0.6065, 0.1353, 0.0302; as shares of their sum 32.3%, 53.2%, 11.9%, 2.6%; the 2013 wave (2.6%) is under 5%
# and dropped; the other three rescaled to 54.65%, 33.15%, 12.20% (exactly 0.546549, 0.331499, 0.121952; rounded so
# they sum to 1).
# CEX, CPS and SIPP shares for 2019 (an odd year takes its own year and the one two years before): weights
# exp(-|2019 - t| / 2) over t = 2019, 2017 give 1 and 0.3679; as shares of their sum 73.11% and 26.89% (exactly
# 0.731059, 0.268941).
# The PUF variables are drawn under the PUF 2015 label in every year (the only PUF year).

year: 2019
prior:
  puf variables: {puf 2015: 1.0}
  balance sheet: {scf 2019: 0.5465, scf 2022: 0.3315, scf 2016: 0.1220}
  consumption: {cex 2019: 0.7311, cex 2017: 0.2689}
  cps items: {cps 2019: 0.7311, cps 2017: 0.2689}
  sipp tips: {sipp 2019: 0.7311, sipp 2017: 0.2689}
