# 2020: the targets of the year's file, written out in full. With prior.yaml and growth.yaml in this folder and the
# catalog (targets_config/catalog.yaml, which says what the words mean), this is the whole of the year's
# configuration. Every value is 2020's: SOI's 2020 tables, the SCF waves and CEX and CPS years of the year's prior,
# and the CPS filing stage's non-filers.
#
# Each entry is a block of targets: every statistic x every variable x every cell, with its population, the source
# of its value and the kind of its error. "key" gives the strings that name each target, (kind, group, target), as
# in the run's fit.csv; in a key, {cell} is the cell's label, {<grouping>} the label of that grouping's part of the
# cell, {variable} the variable's short name, {label} its label, {statistic} the statistic and {year} the year of
# the value. A value's year is the target year unless the entry says otherwise. reason, where present, says why an
# entry departs from the general rule in this year; it fills targets.csv's reason column.
#
# In 2020:
#   - 2020 has no CPS year of its own: the non-filer count and people take the geometric mean of 2019 and 2021, and
#     the count has a 2% judgment error rather than being an identity.

year: 2020
kind: historical

# What every run reports (report_tilt.py writes it).
report:
  - every target with its value, standard error, where the file lands, and the miss in standard errors
  - thin cells, the effective records behind each target and the largest weight factor
  - SOI's published cells in Tables 1.4, 1.6 and 1.7 and the file's miss on each, cells not targeted first
  - untargeted statistics before and after the tilt, largest moves first
  - each trained model's value on untargeted statistics
  - the year's resolved configuration and its expanded target list (targets.csv), the code commit, the vintages read

targets:

  # SOI Table 1.4 by AGI bracket: the number of returns, and the number with and the amount of the four income
  # items. Filers only. The five top brackets are each their own cell, so these entries give the returns and the
  # income composition of each top bracket.
  - id: irs_returns
    kind: IRS
    statistic: units
    population: filers
    cells: {standard_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: returns}

  - id: irs_wages
    kind: IRS
    statistic: [count, amount]
    population: filers
    variable: income_items_standard
    cells: {standard_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  - id: irs_income_items_broad
    kind: IRS
    statistic: [count, amount]
    population: filers
    variable: income_items_broad
    cells: {business_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # Joint returns (married filing jointly and surviving spouses), all AGI, from Table 1.2.
  - id: joint_returns
    kind: IRS
    statistic: units
    population: filers
    cells: {joint_or_not: [joint]}
    value: {published: soi 1.2}
    error: {kind: soi_borrowed}
    key: {group: all, target: joint returns}

  # The number of non-filer units, the CPS filing stage's expected non-filers. With the returns it fixes the
  # number of units in the file.
  - id: non_filers
    kind: non-filers
    statistic: units
    population: non_filers
    cells: all
    value: {pipeline: filing_stage}
    error:
      kind: judgment
      relative: 0.02
      reason: >-
        2020 has no CPS year of its own (the CPS years are the odd years 2015-2023): the value is the geometric mean
        of the filing stage's expected non-filers in 2019 and 2021 (target_list.nonfiler_count), not a count
        the filing stage defines, so it is a target with an error, not an identity; 2% is about the change in the
        count between two CPS years, as a judgment
    key: {group: all, target: non-filers}

  # The people in non-filer units, counted on the CPS units of the filing stage by the file's own rule (heads and
  # spouses by their own age; children among the head, spouse and three dependents the file carries).
  - id: nonfiler_people
    kind: non-filer people
    statistic: amount
    population: non_filers
    variable: nonfiler_people
    cells: all
    value: {pipeline: filing_stage}
    error:
      kind: judgment
      relative: 0.02
      reason: >-
        a fallback tolerance; the true error is likely larger in the youngest band, where the value is a
        small difference of large numbers (2019, 18-25: 33.8 million adults less 24.7 million on returns less 8.1
        million claimed dependents)
    key: {group: 'non-filers, {label}', target: people}

  # Non-filers' dividends, against the non-filers of the pipeline's own tax data. The generated non-filers carry
  # large dividends the source does not have, and the source is before the fill-in of holders the CPS misses, so
  # the error is wide: half the value for the amount and a quarter for the holders.
  - id: nonfiler_dividends
    kind: non-filer items
    statistic: amount
    population: non_filers
    variable: ordinary_dividends
    cells: all
    value: {pipeline: tax_data_nonfilers}
    error: {kind: judgment, relative: 0.5, reason: 'the source is before the fill-in of the dividend holders the CPS misses'}
    key: {group: all, target: 'non-filers, {variable} {statistic}'}

  - id: nonfiler_dividend_holders
    kind: non-filer items
    statistic: count
    population: non_filers
    variable: ordinary_dividends
    cells: all
    value: {pipeline: tax_data_nonfilers}
    error: {kind: judgment, relative: 0.25, reason: 'the source is before the fill-in of the dividend holders the CPS misses'}
    key: {group: all, target: 'non-filers, {variable} {statistic}'}

  # SOI Table 1.7: dependent filers' returns by AGI bracket. Nothing else fixes how many dependent filers there
  # are, and without this the reweighting fills Table 1.6's age counts with them.
  - id: dependent_filer_returns
    kind: dependent filers
    statistic: units
    population: dependent_filers
    cells: {dependent_agi_groups: all}
    value: {published: soi 1.7}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: returns}

  # More of Table 1.7: dependent filers' net capital gain (Form 1040's capital gain line where positive), all AGI,
  # and their returns and net capital gain in Table 1.7's two top brackets, $50,000 under $200,000 and $200,000 or
  # more. Dependent filers are outside Table 4.3 and the SCF targets, so without these the reweighting can raise
  # those with large AGI far above SOI's. Errors borrowed from Table 1.4 as for the returns above.
  - id: dependent_filer_gains
    kind: dependent filers
    statistic: amount
    population: dependent_filers
    variable: capital_gain_positive
    cells: all
    value: {published: soi 1.7}
    error: {kind: soi_borrowed}
    key: {group: all, target: net capital gain}

  # Dependent filers' investment and other income, Table 1.7, all AGI: taxable interest, ordinary dividends,
  # tax-exempt interest, capital gain distributions, capital losses and Schedule C income and loss. This income is
  # what the tax on a child's unearned income falls on.
  - id: dependent_filer_investment_income
    kind: dependent filers
    statistic: [count, amount]
    population: dependent_filers
    variable: [taxable_interest, ordinary_dividends, exempt_int, capital_gain_distributions, capital_gain_loss,
               sole_prop_net_income, sole_prop_net_loss]
    cells: all
    value: {published: soi 1.7}
    error: {kind: soi_borrowed}
    key: {group: all, target: '{variable} {statistic}'}

  - id: dependent_filer_returns_top
    kind: dependent filers
    statistic: units
    population: dependent_filers
    cells: {dependent_agi_top_groups: all}
    value: {published: soi 1.7}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: returns}

  - id: dependent_filer_gains_top
    kind: dependent filers
    statistic: amount
    population: dependent_filers
    variable: capital_gain_positive
    cells: {dependent_agi_top_groups: all}
    value: {published: soi 1.7}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: net capital gain}

  # SOI Table 1.6: returns by the primary filer's age range, 26-34 to 65+, in joint and non-joint returns. Under
  # 26 is not a target of its own: the bracket returns and the joint count leave it, and a sixth target would
  # repeat them. Table 1.6 counts a dependent filer's return under its own age.
  - id: age_returns
    kind: age
    statistic: units
    population: filers
    cells: {joint_or_not: all, adult_age_ranges: [26-34, 35-44, 45-54, 55-64, 65+]}
    value: {published: soi 1.6}
    dependent_filers: >-
      under 26 in the under-26 range; 26 and over (the file has no exact age for them) spread over the five ranges
      26 and over in proportion to this entry's own values in their filing status
    error: {kind: soi_borrowed}
    key: {group: '{joint_or_not}, primary {adult_age_ranges}', target: returns}

  # SOI Table 1.2: returns of single filers, married people filing separately and heads of household in each group
  # of the standard AGI grid (joint returns follow from these, Table 1.4's returns and the joint total). Errors
  # borrowed as for Table 1.6 by AGI.
  - id: status_returns_by_agi
    kind: status by AGI
    statistic: units
    population: filers
    cells: {filing_four: [single, separate, head of household], standard_agi_groups: all}
    value: {published: soi 1.2}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: returns}

  # SOI Table 1.6: returns of heads of household and of married people filing separately by the primary filer's
  # age range, all six ranges, all AGI. The entry above leaves the split of non-joint returns between single
  # filers and heads of household free within each age, and the draw puts heads of household too young. With the
  # entry above and Table 1.3's returns by status these also fix single filers by age. The few married dependent
  # filers filing separately are left out of these cells, as the file has no exact age for them.
  - id: age_returns_by_status
    kind: age by status
    statistic: units
    population: filers
    cells: {filing_four: [separate, head of household], adult_age_ranges: all}
    value: {published: soi 1.6}
    error: {kind: soi_borrowed}
    key: {group: '{filing_four}, primary {adult_age_ranges}', target: returns}

  # SOI Table 1.6 by AGI: returns by the primary filer's age range, 26-34 to 65+, within each group of the
  # standard AGI grid, from the table's All returns panel; the totals by age leave the age mix within AGI free.
  # Summed over AGI these cells equal the totals by age above, to a few returns; both are kept, because the
  # demographic prescaling uses the totals. Errors borrowed from Table 1.4's count cells in the same AGI group,
  # except in the $10m-and-over group, which SOI samples in full.
  - id: age_returns_by_agi
    kind: age by AGI
    statistic: units
    population: filers
    cells: {standard_agi_groups: all, adult_age_ranges: [26-34, 35-44, 45-54, 55-64, 65+]}
    value: {published: soi 1.6}
    dependent_filers: >-
      under 26 in the under-26 range; 26 and over (the file has no exact age for them) spread over the five ranges
      26 and over in proportion to this entry's own values in the same AGI group
    error: {kind: soi_borrowed}
    key: {group: 'all returns, {standard_agi_groups}, primary {adult_age_ranges}', target: returns}

  # Business income: each family's net income and net loss, returns and dollars, in six AGI groups (merged where
  # SOI's published cells cross a group edge): rent and royalty, estates and trusts, and Form 4797's gain and
  # loss. Schedule C and partnership and S corporation income are in business_top instead.
  - id: business
    kind: business
    statistic: [count, amount]
    population: filers
    variable: [rent_royalty_net_income, rent_royalty_net_loss, estate_trust_net_income, estate_trust_net_loss,
               other_gains_net_gain, other_gains_net_loss]
    cells: {business_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
    reason: >-
      variable: estates and trusts are targeted under standard errors, as is Form 4797's gain and loss, although
      their cells are tiny and cannot always be met

  # Taxable state income tax refunds, Table 1.4, in the six business AGI groups. The tax benefit rule (settings
  # taxes) takes refunds off itemizers whose taxes paid exceed the cap by more than the refund; settings
  # taxes.refund_reported_anyway keeps a share of them, as SOI shows refunds on about 5% of returns at AGI $2-5
  # million.
  - id: state_refunds
    kind: IRS
    statistic: [count, amount]
    population: filers
    variable: state_ref
    cells: {business_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # More of Table 1.4 in the business AGI groups: statutory adjustments, tax-exempt interest, unemployment
  # compensation, taxable IRA distributions and taxable pensions.
  - id: irs_more_items
    kind: IRS
    statistic: [count, amount]
    population: filers
    variable: [statutory_adjustments, exempt_int, ui, txbl_ira_dist, txbl_pens_dist, total_pensions]
    cells: {business_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # Alimony received and paid, Table 1.4, all AGI. The draw carries 2015's alimony into every year, while the 2017
  # law ends the inclusion and the deduction for divorces from 2019, so the payments run off.
  - id: alimony
    kind: IRS
    statistic: [count, amount]
    population: filers
    variable: [alimony, alimony_paid]
    cells: all
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: all, target: '{variable} {statistic}'}

  # Farm and farm rental income: one overall target each, net income and net loss, returns and dollars, no AGI
  # groups, as the cells by AGI group held 1,200 to 140,000 returns.
  - id: business_farm
    kind: business
    statistic: [count, amount]
    population: filers
    variable: [farm_net_income, farm_net_loss, farm_rental_net_income, farm_rental_net_loss]
    cells: all
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: all, target: '{variable} {statistic}'}

  # Schedule C and partnership and S corporation income, net income and net loss, returns and dollars: the six
  # groups of the entry above with "$1m and over" cut into $1M-1.5M, $1.5M-2M, $2M-5M, $5M-10M and $10M and over.
  - id: business_top
    kind: business
    statistic: [count, amount]
    population: filers
    variable: business_top
    cells: {business_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # The SCF targets are computed on the year's mix of SCF waves (the prior's "balance sheet"), each wave's balance
  # sheet grown per tax unit to the target year's wave, among the SCF's units below $1 billion of net worth (the
  # Forbes list supplies the units above). Value = sum of share x the wave's value; variance = sum of share^2 x
  # the wave's variance (scf_targets.py).
  # SCF wealth: the share of units above the SCF's 99.9th, 99th, 90th and 50th percentile lines and above $1
  # million, and net worth above each percentile line and in total. Among units other than dependent filers, who
  # hold no wealth in the file.
  - id: wealth_shares
    kind: wealth
    statistic: share
    population: scf_units_below_a_billion
    variable: net_worth
    cells: {scf_net_worth_lines: all}
    value: {survey: scf}
    error: {kind: survey_replicate}
    key: {group: '{cell}', target: share of units}

  - id: wealth_dollars
    kind: wealth
    statistic: amount
    population: scf_units_below_a_billion
    variable: net_worth
    cells: [{scf_net_worth_lines: [above the SCF 99.9th percentile, above the SCF 99th percentile,
                                   above the SCF 90th percentile, above the SCF 50th percentile]}, all]
    value: {survey: scf}
    error: {kind: survey_replicate}
    key: {group: '{cell}', target: '{variable}'}

  # SCF top wealth by kind of asset: the dollars of stocks, business equity, real estate and retirement accounts
  # held by the units above the SCF's 99.9th, 99th and 90th percentile net worth lines.
  - id: wealth_by_asset
    kind: wealth
    statistic: amount
    population: scf_units_below_a_billion
    variable: scf_top_assets
    cells: {scf_net_worth_lines: [above the SCF 99.9th percentile, above the SCF 99th percentile,
                                  above the SCF 90th percentile]}
    value: {survey: scf}
    error: {kind: survey_replicate}
    key: {group: '{cell}', target: '{variable}'}

  # The income by net worth grid: four income groups (below p90, p90-99, p99-99.9, p99.9+ of the seven shared
  # income items, each side's own percentiles) by four net worth classes (the SCF's dollar lines at p90, p99 and
  # p99.9). In each cell: the share of the income group's units in the net worth class, and the class's net worth
  # in the group. The share of the lowest class is left out in each income group, as it is one minus the others.
  # Thin cells merged (fewer than 10 households of the 2019 SCF wave, in any implicate, merged into the next
  # richer class of the same income group):
  #   income p99-99.9: below p90 (3 households) + p90-99 (132) -> at or below p99 (135);
  #   income p99.9+: below p90 (0) + p90-99 (7) + p99-99.9 (83) -> at or below p99.9 (86: a household can sit in
  #   different cells in different implicates, so the merged count is not the sum).
  - id: wealth_grid_shares
    kind: wealth grid
    statistic: share
    population: scf_units_below_a_billion
    variable: net_worth
    cells:
      - {scf_net_worth_classes: [net worth SCF p90-99, net worth SCF p99-99.9, net worth above SCF p99.9],
         income_rank_groups: [income below p90, income p90-99]}
      - {scf_net_worth_classes: [net worth SCF p99-99.9, net worth above SCF p99.9],
         income_rank_groups: [income p99-99.9]}
      - {scf_net_worth_classes: [net worth above SCF p99.9], income_rank_groups: [income p99.9+]}
    value: {survey: scf}
    error: {kind: survey_replicate}
    key: {group: '{scf_net_worth_classes}, {income_rank_groups}', target: share of the income group's units}

  - id: wealth_grid_dollars
    kind: wealth grid
    statistic: amount
    population: scf_units_below_a_billion
    variable: net_worth
    cells:
      - {scf_net_worth_classes: [net worth below SCF p90, net worth SCF p90-99, net worth SCF p99-99.9,
                                 net worth above SCF p99.9],
         income_rank_groups: [income below p90, income p90-99]}
      - {scf_net_worth_classes: [net worth at or below SCF p99, net worth SCF p99-99.9, net worth above SCF p99.9],
         income_rank_groups: [income p99-99.9]}
      - {scf_net_worth_classes: [net worth at or below SCF p99.9, net worth above SCF p99.9],
         income_rank_groups: [income p99.9+]}
    value: {survey: scf}
    error: {kind: survey_replicate}
    key: {group: '{scf_net_worth_classes}, {income_rank_groups}', target: net worth}

  # CEX consumption: each category's average per unit, over all units and in the 12 cells of the primary filer's
  # adult age range by married or not. The overall averages are kept because the cells do not imply them: the
  # file's units fall into the cells in other shares than the CEX's.
  - id: consumption_all
    kind: consumption
    statistic: average
    population: units_other_than_dependent_filers
    variable: consumption
    cells: all
    value: {survey: cex}
    error: {kind: survey_replicate}
    key: {group: 'CEX {year}, all', target: '{variable}, average'}

  - id: consumption_by_age_and_married
    kind: consumption
    statistic: average
    population: units_other_than_dependent_filers
    variable: consumption
    cells: {adult_age_ranges: all, married_or_not: all}
    value: {survey: cex}
    error: {kind: survey_replicate}
    key: {group: 'CEX {year}, age {adult_age_ranges}, {married_or_not}', target: '{variable}, average'}

  # SOI Table 1.3: returns, and the number with and the amount of the income items (AGI its amount only), in each
  # of the four filing statuses. Filers, dependent filers included as SOI counts them. Errors borrowed from the
  # nearest Table 1.4 cells.
  - id: soi_1_3_returns
    kind: soi 1.3
    statistic: units
    population: filers
    cells: {filing_four: all}
    value: {published: soi 1.3}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: returns}

  - id: soi_1_3_agi
    kind: soi 1.3
    statistic: amount
    population: filers
    variable: agi
    cells: {filing_four: all}
    value: {published: soi 1.3}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  - id: soi_1_3_items
    kind: soi 1.3
    statistic: [count, amount]
    population: filers
    variable: soi_1_3_items
    cells: {filing_four: [single, joint, head of household]}
    value: {published: soi 1.3}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # SOI Table 4.3: returns, AGI, and the number with and the amount of eight income items, in the top 0.001%,
  # 0.01%, 0.1% and 1% of AGI. Returns other than dependent filers' with AGI at or above SOI's published cutoff
  # for the group and year, held fixed through the reweighting, so the count above each cutoff is a target (its
  # error borrowed from Table 1.4's cells, or 1% of the value where the cutoff is $10 million or more). The top
  # 0.001% rests on the PUF's rebuilt aggregate records, so expand must keep it (must_reach).
  - id: soi_4_3_returns
    kind: soi 4.3
    statistic: units
    population: independent_filers
    cells: {agi_cumulative: [top 0.001 percent, top 0.01 percent, top 0.1 percent, top 1 percent]}
    must_reach: [top 0.001 percent]
    value: {published: soi 4.3}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: returns}

  - id: soi_4_3_agi
    kind: soi 4.3
    statistic: amount
    population: independent_filers
    variable: agi
    cells: {agi_cumulative: [top 0.001 percent, top 0.01 percent, top 0.1 percent, top 1 percent]}
    must_reach: [top 0.001 percent]
    value: {published: soi 4.3}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  - id: soi_4_3_items
    kind: soi 4.3
    statistic: [count, amount]
    population: independent_filers
    variable: soi_4_3_items
    cells: {agi_cumulative: [top 0.001 percent, top 0.01 percent, top 0.1 percent, top 1 percent]}
    must_reach: [top 0.001 percent]
    value: {published: soi 4.3}
    error: {kind: soi_borrowed}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # Auto loan interest from the SCF: in the four income groups of the wealth grid, the share of units with any and
  # the dollars per unit, on the year's mix of SCF waves. Stated per unit rather than as totals, because the SCF's
  # units are fewer than the file's.
  - id: auto_loans
    kind: auto loans
    statistic: average
    population: scf_units_below_a_billion
    variable: auto_loans
    cells: {income_rank_groups: all}
    value: {survey: scf}
    error: {kind: survey_replicate}
    key: {group: '{income_rank_groups}', target: '{variable}, average'}

  # Tips: SOI's Form W-2 statistics, Table 4.B, box 7 (Social Security tips), returns with any and the amount, in
  # joint and non-joint returns. The file's tips are measured as box 7 has them (catalog ss_tips). Returns other
  # than dependent filers': the non-joint value is reduced by the SIPP's share of dependents among non-joint
  # tipped people (count) or tips (amount), and half that reduction is added to the error.
  - id: tips_w2
    kind: tips
    statistic: [count, amount]
    population: independent_filers
    variable: ss_tips
    cells: {joint_or_not: all}
    value: {published: soi w2}
    error: {kind: soi_borrowed}
    key: {group: '{cell} returns', target: '{variable} {statistic}'}

  # Tipped workers, counted person by person (the primary and spouse slots, filers other than dependent filers):
  # the number of tipped workers on joint returns (Table 4.B counts taxpayers, up to two on a joint return). On
  # non-joint returns a return is one worker, so those are the returns with tips above.
  - id: tips_w2_workers
    kind: tips
    statistic: workers
    population: independent_filers
    variable: ss_tips
    cells: {joint_or_not: [joint]}
    value: {published: soi w2}
    error: {kind: soi_borrowed}
    key: {group: '{cell} returns', target: '{variable} {statistic}'}
  # and the share of tipped workers above each Table 4.C percentile line, the 10th to the 99th
  - id: tips_w2_spread
    kind: tips
    statistic: worker share
    population: independent_filers
    variable: ss_tips
    cells: all
    percentiles: [10, 25, 50, 75, 90, 99]
    value: {published: soi w2 pctiles}
    error: {kind: soi_borrowed}
    key: {group: tipped workers, target: '{variable} workers above ${line:,.0f}'}

  # Elective deferrals: SOI's Form W-2 statistics, Table 2.D, contributions (traditional plus Roth) in eight AGI
  # groups: on joint returns the dollars only (Table 2.D counts taxpayers, up to two on a joint return, and the
  # file's counts are of returns); on non-joint returns the returns with any and the dollars. The non-joint values
  # are reduced for dependent filers as for tips.
  - id: deferrals_w2_joint
    kind: deferrals
    statistic: amount
    population: independent_filers
    variable: w2_elective_deferrals
    cells: {w2_agi_groups: all, joint_or_not: [joint]}
    value: {published: soi w2 2.d}
    error: {kind: soi_borrowed}
    key: {group: '{cell} returns', target: '{variable} {statistic}'}
  - id: deferrals_w2_nonjoint
    kind: deferrals
    statistic: [count, amount]
    population: independent_filers
    variable: w2_elective_deferrals
    cells: {w2_agi_groups: all, joint_or_not: [non-joint]}
    value: {published: soi w2 2.d}
    error: {kind: soi_borrowed}
    key: {group: '{cell} returns', target: '{variable} {statistic}'}

  # Overtime pay from the CPS's own tax units, as the CEX consumption targets are: the share of units with any
  # overtime pay and overtime dollars per unit, over all units and in four groups of the unit's wages. The file's
  # ot is ot1 + ot2, each person's held to their wages less tips; the CPS's follows Tedeschi's rules per person
  # (overtime_cps.R). Overtime is known only for the units asked the earnings questions, so each average is over
  # those units. Value: the year's CPS mix; error: the ASEC's 160 replicate weights.
  - id: overtime_all
    kind: overtime
    statistic: average
    population: units_other_than_dependent_filers
    variable: overtime
    cells: all
    value: {survey: cps}
    error: {kind: survey_replicate}
    key: {group: 'CPS {year}, all', target: '{variable}, average'}
  - id: overtime_by_wages
    kind: overtime
    statistic: average
    population: units_other_than_dependent_filers
    variable: overtime
    cells: {wage_groups_4: all}
    value: {survey: cps}
    error: {kind: survey_replicate}
    key: {group: 'CPS {year}, {wage_groups_4}', target: '{variable}, average'}

  # Taxes computed by the calculator (taxes.py): items tax-simulator-gpu computes under the year's law for every
  # record of the start, before the reweighting. Filers; AGI groups by the file's own AGI, as every IRS target.
  # Values: SOI Tables 1.4 and 3.3 of the year; errors: their published CVs. One entry per item, so an item can be
  # dropped alone.
  - id: calc_itemizers
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: itemized_deductions_claimed
    cells: {standard_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
  - id: calc_taxable_income
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: taxable_income
    cells: {standard_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
  - id: calc_tax_before_credits
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: income_tax_before_credits
    cells: {standard_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
  # The QBI deduction's dollars by AGI, Table 1.4, without its counts: SOI counts returns whose deduction comes
  # from REIT dividends and publicly traded partnerships, which the file does not carry.
  - id: calc_qbi_amount
    kind: calculator
    statistic: amount
    population: filers
    variable: qbi_deduction
    cells: {calc_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  - id: calc_child_credit
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: ctc_nonrefundable
    cells: {nonref_credit_agi_groups: all}
    value: {published: soi 3.3}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
  - id: calc_child_credit_refundable
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: ctc_refundable
    cells: {ref_credit_agi_groups: all}
    value: {published: soi 3.3}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
  # Table 3.3's education credits: the draw carries 2015's claims, and the number of returns claiming them fell
  # after 2015.
  - id: calc_education_credits
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: [education_credit_nonrefundable, aotc_refundable]
    cells: {ref_credit_agi_groups: all}
    value: {published: soi 3.3}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
  # Table 3.3's self-employment tax, in the business AGI groups. The draw splits a couple's wages and
  # self-employment income between the spouses with too little of the CPS's pattern, so too much of it sits above
  # the Social Security wage base and the tax comes out low.
  - id: calc_se_tax
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: self_employment_tax
    cells: {business_agi_groups: all}
    value: {published: soi 3.3}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
  # Table 2.5: the returns with the earned income credit and its amount by the number of qualifying children, all
  # AGI. The EITC by AGI below leaves the mix of children free. Table 2.5 in the mirror stops at tax year 2020.
  - id: calc_eitc_children
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: eitc
    cells: {eitc_children: all}
    value: {published: soi 2.5}
    error: {kind: soi_borrowed}
    key: {group: '{eitc_children} qualifying children', target: '{variable} {statistic}'}

  # Table 3.3's retirement savings contributions credit, used against tax, by AGI. The child and dependent care
  # credit is not targeted, as targeting it pushed mean child care spending among payers far above the CPS's.
  - id: calc_small_credits
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: [savers_credit]
    cells: {ref_credit_agi_groups: all}
    value: {published: soi 3.3}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  - id: calc_eitc
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: eitc
    cells: {eitc_agi_groups: all}
    value: {published: soi 3.3}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}
  - id: calc_amt
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: alternative_minimum_tax
    cells: {amt_agi_groups: all}
    value: {published: soi 1.4}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  - id: calc_itemized_medical
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: itemized_medical
    cells: {itemized_agi_groups: all}
    value: {published: soi 2.1}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  - id: calc_itemized_taxes
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: itemized_taxes
    cells: {itemized_agi_groups: all}
    value: {published: soi 2.1}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  - id: calc_itemized_interest
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: itemized_interest
    cells: {itemized_agi_groups: all}
    value: {published: soi 2.1}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # Table 2.1's cash gifts and gifts other than cash on itemizing returns, as reported (before the deduction's
  # limits). The deduction itself, the next entry, leaves the split free.
  - id: calc_itemized_charity_split
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: [itemized_charity_cash, itemized_charity_noncash]
    cells: {itemized_agi_groups: all}
    value: {published: soi 2.1}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  - id: calc_itemized_charity
    kind: calculator
    statistic: [count, amount]
    population: filers
    variable: itemized_charity
    cells: {itemized_agi_groups: all}
    value: {published: soi 2.1}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  - id: calc_itemized_other
    kind: calculator
    statistic: amount
    population: filers
    variable: itemized_other
    cells: {itemized_agi_groups: all}
    value: {published: soi 2.1}
    error: {kind: soi_cv}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # Balance-sheet category dollars and holders within each SCF net worth class.
  - id: wealth_categories
    kind: wealth
    statistic: [count, amount]
    population: scf_units_below_a_billion
    variable: scf_wealth_categories
    cells: {scf_net_worth_classes: [net worth below SCF p90, net worth above SCF p90]}
    value: {survey: scf}
    error: {kind: survey_replicate}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # The SCF's balance sheet by the primary filer's age: holders and dollars of the nine categories in four age
  # groups (under 55, 55-64, 65-79, 80 and over), on the same waves, population and errors as wealth_categories.
  # Without an age in any wealth target the reweighting took net worth from units aged 65-79 rather than from the
  # young.
  - id: wealth_categories_by_age
    kind: wealth
    statistic: [count, amount]
    population: scf_units_below_a_billion
    variable: scf_wealth_categories
    cells: {scf_age_groups: all}
    value: {survey: scf}
    error: {kind: survey_replicate}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # Unrealized capital gains by kind (stocks and funds, businesses, the primary home, other real estate) in the
  # same age groups, each gain held to its asset's value and never below zero, as tax-simulator-gpu has them: the
  # holders (units with a gain above zero) and the dollars.
  - id: unrealized_gains_by_age
    kind: wealth
    statistic: [count, amount]
    population: scf_units_below_a_billion
    variable: scf_unrealized_gains
    cells: {scf_age_groups: all}
    value: {survey: scf}
    error: {kind: survey_replicate}
    key: {group: '{cell}', target: '{variable} {statistic}'}

  # The number of tax units, filers and non-filers, whose primary filer is 65-69, 70-74, 75-79 and 80 and over,
  # from the CPS's tax units over the year's CPS mix (SOI's Table 1.6 stops at 65 and over), standard errors from
  # the ASEC's replicate weights. Units other than dependent filers, as the CPS's units fold them into the unit
  # that claims them.
  - id: units_by_older_age
    kind: older ages
    statistic: units
    population: units_other_than_dependent_filers
    cells: {older_age_groups: all}
    value: {survey: cps units}
    error: {kind: survey_replicate}
    key: {group: '{cell}', target: units}
