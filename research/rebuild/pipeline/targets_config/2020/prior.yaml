# 2020: the prior the year's file is drawn under: the PUF year, and the SCF waves and CEX, CPS and SIPP years each
# record is drawn from, with their shares. Read by generate.py and survey_mix.py; the SCF and survey targets use the
# same waves, years and shares. Each share comes from weights exp(-|year - t| / 2) over the survey years t, those
# under 5% dropped and the rest rescaled. See TARGETS.md, "The year's mix of survey years".
# SCF shares for 2020: weights exp(-|2020 - t| / 2) over the waves' income years t = 2021, 2018, 2015, 2012 give
# 0.6065, 0.3679, 0.0821, 0.0183; as shares of their sum 56.4%, 34.2%, 7.6%, 1.7%; the 2013 wave (1.7%) under 5% and
# dropped; the rest rescaled to 57.41%, 34.82%, 7.77% (exactly 0.574097, 0.348207, 0.077696; rounded so they sum to
# 1).
# CEX, CPS and SIPP shares for 2020 (an even year takes the years either side): weights exp(-|2020 - t| / 2) over t
# = 2021, 2019 give 0.6065, 0.6065; as shares of their sum 50.00%, 50.00% (exactly 0.500000, 0.500000).
# The PUF variables are drawn under the PUF 2015 label in every year (the only PUF year).

year: 2020
prior:
  puf variables: {puf 2015: 1.0}
  balance sheet: {scf 2022: 0.5741, scf 2019: 0.3482, scf 2016: 0.0777}
  consumption: {cex 2021: 0.5000, cex 2019: 0.5000}
  cps items: {cps 2021: 0.5000, cps 2019: 0.5000}
  sipp tips: {sipp 2021: 0.5000, sipp 2019: 0.5000}
