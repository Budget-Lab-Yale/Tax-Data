# The catalog: definitions that do not change from year to year (TARGETS.md section 12).
#
# A year's file (years/<year>.yaml) and the files it inherits from (historical.yaml or projection.yaml, then
# defaults.yaml) name things defined here: sources, populations, variables, groupings of units into cells, kinds of
# standard error and the tax-unit rules a survey's units were built with. The year files say what to target; this
# file says what the words mean. target_list.py reads all of them. Edited rarely: when a source, variable or
# grouping is added.
#
# Writing rules for every file in this folder (target_list.py checks them when it reads the files):
#   - no YAML anchors, aliases or tags;
#   - numbers written out (1000000, 0.02), never 1e6 (YAML reads 1e6 as text);
#   - text containing a comma is quoted inside [ ] or { } (unquoted, the comma splits it);
#   - digits joined by an underscore are quoted ('18_25'; unquoted, YAML reads 18_25 as the number 1825);
#   - an unknown key is an error, so a misspelt key cannot be silently ignored.

# ---------------------------------------------------------------------------------------------------------------
# Sources: where a target's value comes from (TARGETS.md section 3 and 13).
#   published  a table in the SOI mirror (settings paths.raw.soi_mirror), as published, read through targets.py
#              (Tables 1.4 and 1.2 from the run's targets/soi.csv; Table 1.6 from settings ages.table_1_6)
#   survey     a survey's tax units, one row per unit with a weight; the value is the same statistic computed on the
#              survey's own units. Each names the tax-unit rules its units were built with (tax_unit_rules below).
#   pipeline   a number computed fresh by an earlier stage of the same run, versioned by the code commit
#              (TARGETS.md section 13, item 1)
# ---------------------------------------------------------------------------------------------------------------
sources:
  soi 1.4:
    kind: published
    what: SOI Publication 1304, Table 1.4, all returns by size of AGI, sources of income
  soi 1.2:
    kind: published
    what: SOI Publication 1304, Table 1.2, all returns by size of AGI and filing status
  soi 1.7:
    kind: published
    file: bysize_dependent_returns.csv
    what: SOI Publication 1304, Table 1.7, returns of dependents (dependent filers) by size of AGI, read from the mirror
  soi 1.6:
    kind: published
    what: SOI Publication 1304, Table 1.6, returns by filing status and age of the primary taxpayer, all AGI
  # Tables 1.3 and 4.3 (27 October; run G2 of explore_targets_13_43_RESULTS.md, approved by John), read from the tidy
  # files of the local IRS-Ind store (settings paths.raw.soi_tables): one row per published cell, selected by the
  # variable's item and measure (variables, "published") and the grouping's published labels (groupings). Errors are
  # borrowed from the nearest Table 1.4 cells (target_list.published_grid); a Table 4.3 group whose published AGI
  # cutoff is at or above full_sample_above gets errors.full_sample_se instead (SOI samples every such return).
  soi 1.3:
    kind: published
    layout: tidy_grid
    table: '1.3'
    file: bystatus_all_items.csv
    units: {item: adjusted gross income less deficit, units: returns}
    what: SOI Publication 1304, Table 1.3, all returns, sources of income by filing status
  soi 4.3:
    kind: published
    layout: tidy_grid
    table: '4.3'
    file: pctile_top_items.csv
    units: {item: all, units: returns}
    cutoff_item: adjusted gross income floor on percentiles (whole dollars)
    full_sample_above: 10000000
    what: >-
      SOI Table 4.3, returns other than dependent filers' by cumulative AGI percentile group (top 0.001% to top 50%),
      selected income items
  # SOI's Form W-2 statistics (27 October, candidate): Table 4.B, the summary of W-2 items for taxpayers on
  # individual returns, by joint and non-joint returns (settings paths.raw.soi_w2, w2_t4_<year>.xlsx). W-2s of
  # people who file no return are not in it. Box 7 is Social Security tips: tips the employee reported to the
  # employer, with box 3 (Social Security wages) plus box 7 at most that year's Social Security wage base.
  # Non-joint returns include dependent filers, who hold no tips in the file (stage 1, decision 11): for a target
  # whose population leaves them out, the non-joint value is reduced by the SIPP's share of non-joint tipped people
  # (for a count) or tips (for an amount) who are dependents (target_list.published_w2), and half of that reduction
  # is added to the error as a definition gap.
  soi w2:
    kind: published
    layout: w2_summary
    file: w2_t4_{year}.xlsx
    sheet: Table 4.B
    dependent_share: {survey: sipp, persons: 'data/persons_sipp_{year}.parquet', units: 'data/sipp_units_{year}_all.parquet', gap_share: 0.5}
    what: SOI Form W-2 statistics, Table 4.B, summary of items for taxpayers with Form W-2, by joint and non-joint returns
  # The same workbook's Table 4.C (28 October, candidate): the percentiles of box 7 among individuals with a box 7
  # value (all individuals on filed returns, dependent filers included). A target is the share of workers above a
  # percentile's dollar line, one minus the percentile; the dependent filers' share of workers (Table 4.B, the SIPP)
  # sets part of its error (target_list.published_w2_shares).
  soi w2 pctiles:
    kind: published
    layout: w2_percentiles
    file: w2_t4_{year}.xlsx
    sheet: Table 4.C
    summary_sheet: Table 4.B
    dependent_share: {survey: sipp, persons: 'data/persons_sipp_{year}.parquet', units: 'data/sipp_units_{year}_all.parquet', gap_share: 0.5}
    what: SOI Form W-2 statistics, Table 4.C, values of selected items by percentile, box 7 (Social Security tips)
  # The W-2 statistics' Table 2.D (28 October; decided by John 27 October): taxpayers with elective retirement
  # contributions (traditional plus Roth) and the contributions, by size of AGI and by return and earner type
  # (w2_t2_<year>.xlsx; the 2019 and 2020 layout). Every AGI row of the table must fall inside one of the entry's AGI
  # groups (target_list.published_w2_agi). Non-joint returns include dependent filers, who hold no survey items in the
  # file: for a population that leaves them out, the non-joint value is reduced by the SIPP's share of dependents
  # among non-joint people with deferrals (people for a count, dollars for an amount; the SIPP year nearest the target
  # year that asks deferrals), and half of that reduction is added to the error, as for the tips targets.
  soi w2 2.d:
    kind: published
    layout: w2_by_agi
    file: w2_t2_{year}.xlsx
    sheet: Table 2.D
    dependent_share: {survey: sipp, years: [2021, 2023], persons: 'data/persons_sipp_{year}.parquet', units: 'data/sipp_units_{year}.csv.gz', gap_share: 0.5}
    what: SOI Form W-2 statistics, Table 2.D, taxpayers with elective retirement contributions by size of AGI and return and earner type
  scf:
    kind: survey
    file: data/scf_units_{year}.parquet
    built_by: [roster_scf.py, build_scf.R]
    tax_unit_rules: shared_cbo
    what: every tax unit of the SCF wave of that year (its income is the year before), five implicates, weights as built;
      the targets read each wave's units from the training table and pool the year's mix of waves (scf_targets.py)
  cex:
    kind: survey
    file: data/cex_units_{year}_all.parquet
    built_by: [roster_cex.py, build_cex.R]
    tax_unit_rules: shared_cbo
    what: every tax unit of the CEX year (build_table.cex_target_units); dependent filers folded into the unit that claims them
  filing_stage:
    kind: pipeline
    built_by: [filing.py, build_cps.R, build_table.py]
    tax_unit_rules: shared_cbo
    what: >-
      The CPS filing stage. The non-filer count is the sum over the CPS units of the training table of weight times
      one minus the chance of filing (the count the generated non-filer batch is sized by). The non-filer people are
      the numbers the stage's calibration hit, read from settings tilt.nonfiler_targets_dir inside the run's data
      folder, file <year>_nonfilers_vs_targets.csv, column target_heads_spouses (millions of people).

# ---------------------------------------------------------------------------------------------------------------
# The tax-unit rules a survey's units are built with. Moving the SCF to the shared rules changed its median net
# worth from $91,050 to $63,570, so every survey target names the rules its value was computed on. The row of the
# expanded list records the module, the settings that select its variant, and the code commit.
# ---------------------------------------------------------------------------------------------------------------
tax_unit_rules:
  shared_cbo:
    module: tax_units.py
    what: CBO's public tax-unit algorithm (US-CBO/CPS-tax-filing-units) translated rule by rule, TAX_UNITS.md section 4
    settings:
      scf: [tax_units.reassign, tax_units.npeu_split]
      cex: [tax_units.reassign]
      filing_stage: [cps.cbo_variant, filing.mfs_salt]

# ---------------------------------------------------------------------------------------------------------------
# Populations: which units a target is about. A share or an average is over the population's units in the cell.
# ---------------------------------------------------------------------------------------------------------------
populations:
  filers:                             {rule: filer == 1}
  non_filers:                         {rule: filer == 0}
  all_units:                          {rule: all}
  units_other_than_dependent_filers:  {rule: age_range < 6, why: the surveys count dependent filers inside the unit that claims them}
  dependent_filers:                   {rule: filer == 1 and age_range >= 6, why: "the PUF's three dependent age ranges (common.DEPENDENT_RANGES)"}
  independent_filers:                 {rule: filer == 1 and age_range < 6, why: "returns other than dependent filers' (Table 4.3's population; the W-2 tips targets)"}

# ---------------------------------------------------------------------------------------------------------------
# Statistics. Each is a linear condition on the file's weights.
#   units    number of units in the cell (no variable)
#   count    number of units in the cell with the variable nonzero
#   workers  (variables defined person by person: ss_tips) the number of people, primary and spouse, with a positive value
#   worker share  the share of those people whose value is above a dollar line (the row's line)
#   amount   sum of the variable over the cell
#   average  the variable's average over the cell's units, zeros included
#   share    the share of the cell's units above a line (the average of a 0/1 indicator)
#   share of total  an item's share of its total that falls in the cell (an AGI rank group); only in the targets
#            hold_distribution builds from the start file (target_list.hold_rows, TARGETS.md S7)
# An average or a share is written as a condition that holds whatever the reweighting does to the number of units
# in the cell (target_list.average_condition).
# ---------------------------------------------------------------------------------------------------------------
statistics: [units, count, amount, average, share, workers, worker share]

# ---------------------------------------------------------------------------------------------------------------
# Kinds of error (TARGETS.md section 9). errors.py computes the first three; a judgment number is written in the
# configuration with a one-line reason; an identity has no error and is hit exactly.
#   soi_cv            SOI's published coefficient of variation for the cell (Tables 1.4, 2.1, 3.3)
#   soi_borrowed      another SOI table: the coefficient of variation of the nearest Table 1.4 cell
#   survey_replicate  sampling error from the survey's replicate weights
#   judgment          a number we set: {kind: judgment, relative: <share of the value>, reason: <one line>}
#   identity          a count that defines the population; exact
# ---------------------------------------------------------------------------------------------------------------
error_kinds: [soi_cv, soi_borrowed, survey_replicate, judgment, identity]

# ---------------------------------------------------------------------------------------------------------------
# Variables a target can name. For each: how a record's value is computed, its short name in the target's key, and
# its lines in each published table (the line's "number of returns" is the count, its "amount" the amount; where a
# variable has several lines, amounts add with their signs and counts add).
#   record:      a column of the file
#   parts:       the sum of these columns of the file (the same columns on a survey's units)
#   family:      a business family's net income (its net where positive) or net loss (minus its net where
#                negative); the net is the signed sum of the family's PUF parts (targets.FAMILIES)
#   people:      the number of people in the unit, among the given members, whose exact age is in [from, to);
#                members: head, spouse, dep1-dep3 (columns age_primary, age_spouse, age_dep1-3; -1 for none)
#   family with side net: the family's signed net (income less loss)
#   base + transform: another variable's value, transformed: positive (its positive part), loss (minus its negative
#                part), loss_allowed (the loss allowed on Form 1040: at most $3,000, $1,500 if married filing
#                separately, mars 3), any (1 where it is not zero, else 0; its average is the share of units with any)
#   ss_tips:     W-2 box 7 tips: each person's tips held so that wages less tips plus tips is at most the target year's
#                Social Security wage base (wage_base, by year), summed over the people [[wages, tips], ...]
#   count_variable: the variable whose nonzero values the count statistic counts, where a published count and
#                amount have different definitions (Table 4.3's capital gains: returns with a gain, net gain less loss)
#   published:   the variable's item and measures in a tidy published table (sources soi 1.3, soi 4.3)
# The SOI lines are the variable names of the run's targets/soi.csv (targets.T14).
# ---------------------------------------------------------------------------------------------------------------
variables:
  wages:
    record: wages
    short: wages
    soi 1.4: {count: [wages], amount: [wages]}
    published:
      soi 1.3: {item: salaries and wages, count: returns, amount: amount}
      soi 4.3: {item: salaries and wages, count: returns, amount: amount}
  taxable_interest:
    record: interest
    short: interest
    soi 1.4: {count: [taxable_interest], amount: [taxable_interest]}
    published:
      soi 1.3: {item: taxable interest, count: returns, amount: amount}
      soi 4.3: {item: taxable interest, count: returns, amount: amount}
  ordinary_dividends:
    record: dividends
    short: dividends
    soi 1.4: {count: [ordinary_dividends], amount: [ordinary_dividends]}
    published:
      soi 1.3: {item: ordinary dividends, count: returns, amount: amount}
      soi 4.3: {item: ordinary dividends, count: returns, amount: amount}
  sch_d_net_capital_gain:
    record: capital_gains               # the Schedule D net: short term + long term + other (dollars.py)
    short: capital_gains
    what: returns with a Schedule D net gain or net loss, and the net gain less the net loss
    soi 1.4: {count: [sch_d_net_gain, sch_d_net_loss], amount: [sch_d_net_gain, minus sch_d_net_loss]}
  # AGI and business income on the file's definitions (dollars.py), for hold_distribution (TARGETS.md S7): AGI is
  # wages + interest + dividends + Schedule D net capital gain + the rest (dollars.AGI_PARTS); business income the
  # signed sum of its eighteen parts (Schedules C, E and F).
  agi:
    parts: [wages, interest, dividends, capital_gains, other_agi]
    short: agi
    published:
      soi 1.3: {item: adjusted gross income less deficit, count: returns, amount: amount}
      soi 4.3: {item: adjusted gross income less deficit, count: returns, amount: value, returns_item: all}
  # Table 1.3's and Table 4.3's income items on the file's definitions (dollars.py), 27 October (run G2 of
  # explore_targets_13_43_RESULTS.md). Total income is AGI plus the adjustments. Capital gains: Form 1040 line 13
  # (capital_gains_line13, distributions included); Table 1.3's net gain is its positive part, its net loss the loss
  # allowed on the return (run G2: the file's Schedule D pieces are drawn separately, so their sum can pass the cap;
  # SOI's loss is the allowed loss). Table 4.3's capital gains amount is the net gain less the loss, its count the
  # returns with a gain. Its business item is Schedules C and F together.
  total_income:
    parts: [wages, interest, dividends, capital_gains, other_agi, adjustments]
    short: total_income
    published:
      soi 1.3: {item: total income, count: returns, amount: amount}
  tax_exempt_interest:
    record: tax_exempt_interest
    short: tax_exempt_interest
    published:
      soi 1.3: {item: tax exempt interest, count: returns, amount: amount}
  state_refunds:
    record: state_refunds
    short: state_refunds
    published:
      soi 1.3: {item: state income tax refunds, count: returns, amount: amount}
  alimony:
    record: alimony
    short: alimony
    published:
      soi 1.3: {item: alimony received, count: returns, amount: amount}
  capital_gain_total:
    record: capital_gains_line13
    short: capital_gain_total
    count_variable: capital_gain_positive
    published:
      soi 4.3: {item: 'sales of capital assets, net gain less loss', count: returns, amount: amount}
  capital_gain_positive:
    base: capital_gain_total
    transform: positive
    short: capital_gain_positive
    published:
      soi 1.3: {item: sales of capital assets net gain, count: returns, amount: amount}
  capital_gain_loss:
    base: capital_gain_total
    transform: loss_allowed
    short: capital_gain_loss
    published:
      soi 1.3: {item: sales of capital assets net loss, count: returns, amount: amount}
  other_gains:
    record: other_gains
    short: other_gains
    published:
      soi 1.3: {item: 'sales of property other than capital assets, net gain less loss', count: returns, amount: amount}
  ira_taxable:
    record: ira_taxable
    short: ira_taxable
    published:
      soi 1.3: {item: taxable individual retirement arrangement (ira) distributions, count: returns, amount: amount}
  pensions_taxable:
    record: pensions_taxable
    short: pensions_taxable
    published:
      soi 1.3: {item: taxable pensions and annuities, count: returns, amount: amount}
  ss_taxable:
    record: ss_taxable
    short: ss_taxable
    published:
      soi 1.3: {item: taxable social security benefits, count: returns, amount: amount}
  unemployment:
    record: unemployment
    short: unemployment
    published:
      soi 1.3: {item: unemployment compensation, count: returns, amount: amount}
  sch_c_net_income:
    family: sch_c
    side: net_income
    short: sch_c net_income
    soi 1.4: {count: [sch_c_net_income], amount: [sch_c_net_income]}
    published:
      soi 1.3: {item: business or profession net income, count: returns, amount: amount}
  sch_c_net_loss:
    family: sch_c
    side: net_loss
    short: sch_c net_loss
    soi 1.4: {count: [sch_c_net_loss], amount: [sch_c_net_loss]}
    published:
      soi 1.3: {item: business or profession net loss, count: returns, amount: amount}
  rent_royalty_net_income:
    family: rent_royalty
    side: net_income
    short: rent_royalty net_income
    soi 1.4: {count: [rent_royalty_net_income], amount: [rent_royalty_net_income]}
    published:
      soi 1.3: {item: total rental and royalty net income, count: returns, amount: amount}
  rent_royalty_net_loss:
    family: rent_royalty
    side: net_loss
    short: rent_royalty net_loss
    soi 1.4: {count: [rent_royalty_net_loss], amount: [rent_royalty_net_loss]}
    published:
      soi 1.3: {item: total rental and royalty net loss, count: returns, amount: amount}
  pship_scorp_net_income:
    family: pship_scorp
    side: net_income
    short: pship_scorp net_income
    soi 1.4: {count: [pship_scorp_net_income], amount: [pship_scorp_net_income]}
    published:
      soi 4.3: {item: partnership and s corporation > net income, count: returns, amount: amount}
  pship_scorp_net_loss:
    family: pship_scorp
    side: net_loss
    short: pship_scorp net_loss
    soi 1.4: {count: [pship_scorp_net_loss], amount: [pship_scorp_net_loss]}
    published:
      soi 4.3: {item: partnership and s corporation > net loss, count: returns, amount: amount}
  pship_scorp_net:
    family: pship_scorp
    side: net
    short: pship_scorp_net
    published:
      soi 1.3: {item: partnership and s corporation net income less loss, count: returns, amount: amount}
  estate_trust_net:
    family: estate_trust
    side: net
    short: estate_trust_net
    published:
      soi 1.3: {item: estate and trust net income less loss, count: returns, amount: amount}
  farm_net:
    family: farm
    side: net
    short: farm_net
    published:
      soi 1.3: {item: farm net income less loss, count: returns, amount: amount}
  farm_rental_net:
    family: farm_rental
    side: net
    short: farm_rental_net
    published:
      soi 1.3: {item: farm rental net income less loss, count: returns, amount: amount}
  sch_cf_income:
    record: sch_cf_income
    short: Schedules C and F income
  sch_cf_positive:
    base: sch_cf_income
    transform: positive
    short: sch_cf_positive
    published:
      soi 4.3: {item: business or profession (from schedules c and f) > net income, count: returns, amount: amount}
  sch_cf_loss:
    base: sch_cf_income
    transform: loss
    short: sch_cf_loss
    published:
      soi 4.3: {item: business or profession (from schedules c and f) > net loss, count: returns, amount: amount}
  # Tips as Form W-2 box 7 has them (27 October, candidate): each person's tips (tips1, tips2, drawn from the SIPP)
  # held so that the person's wages other than tips plus the tips are at most the Social Security wage base, as box 3
  # plus box 7 are (Form W-2 instructions); a person whose other wages pass the base has no box 7 tips. The base by
  # year is the SSA's contribution and benefit base.
  ss_tips:
    ss_tips: [[wages1, tips1], [wages2, tips2]]
    wage_base: {2015: 118500, 2016: 118500, 2017: 127200, 2018: 128400, 2019: 132900, 2020: 137700,
                2021: 142800, 2022: 147000, 2023: 160200, 2024: 168600}
    short: Social Security tips
    published:
      soi w2: {item: 'Box 7: Social security tips'}
      soi w2 pctiles: {item: 'Box 7: Social security tips'}
  # Elective deferrals as the W-2 statistics count them (28 October): each person's elective contributions,
  # traditional plus Roth, after the legal limit for their age and their own wages (dollars.deferral_items), summed
  # over the primary filer and the spouse. A count is returns with any (on non-joint returns, one taxpayer each).
  w2_elective_deferrals:
    parts: [elective1, elective2]
    short: elective deferrals
    published:
      soi w2 2.d: {count: Number of taxpayers, amount: Contributions}
  # Auto loan interest (27 October, candidate): the SCF's auto_int_exp, the amount still owed on each of up to four
  # vehicle loans times its current rate (build_scf.R), the same column on the SCF's units and on the file (drawn in
  # the SCF phase and grown per tax unit to the target year's wave, as the balance sheet). The share of units with
  # any is the average of the 0/1 indicator.
  auto_loan_interest:
    record: auto_int_exp
    short: auto loan interest
  any_auto_loan_interest:
    base: auto_loan_interest
    transform: any
    short: units with auto loan interest
  business_income:
    record: business_income
    short: business_income
  net_worth:
    record: net_worth                   # the 14 assets less the 6 debts (dollars.py), in the wave's dollars
    short: net worth
  # Four kinds of asset on the balance sheet (TARGETS.md S2), the same columns on the SCF's units (build_scf.R, from
  # the SCF summary extract) and on the generated file (dollars.py draws each from the SCF's map). Gross values:
  # the debts against them (mortgages) are not taken off.
  stocks:
    parts: [w_equities]
    short: stocks
    what: stocks held directly plus stock and combination mutual funds (SCF STOCKS + STMUTF + COMUTF)
  business_equity:
    parts: [w_pass_throughs]
    short: business equity
    what: the value of privately held businesses, actively and not actively managed (SCF BUS)
  real_estate:
    parts: [w_primary_home, w_other_home, w_re_fund]
    short: real estate
    what: >-
      the primary residence, other residential real estate and net equity in nonresidential real estate (SCF
      HOUSES + ORESRE + NNRESRE), before mortgages on them
  retirement_accounts:
    parts: [w_dc, w_db]
    short: retirement accounts
    what: >-
      IRAs and Keoghs, account-type plans at current jobs, and account-type plans from past jobs or now paying out
      (SCF IRAKH + THRIFT + FUTPEN + CURRPEN, the SCF's quasi-liquid retirement assets, RETQLIQ); defined-benefit
      pensions are not in the SCF's net worth and not here
  # The seven income items the SCF and the file share, for ranking units by income (the income x net worth grid,
  # historical.yaml). On the file: wages, interest, dividends, line-13 capital gains, gross retirement income,
  # Schedules C and F, Schedule E. On the SCF's units: the same items as the training table carries them after translation.
  income_7_items:
    parts: [wages, interest, dividends, capital_gains_line13, retirement_gross, sch_cf_income, sch_e_income]
    survey_parts: [wages, interest, dividends, capital_gains, retirement_gross, sch_cf_income, sch_e_income]
    short: income
  c_clothing:              {record: c_clothing, short: c_clothing}
  c_motor_vehicles:        {record: c_motor_vehicles, short: c_motor_vehicles}
  c_durables:              {record: c_durables, short: c_durables}
  c_other_nondurables:     {record: c_other_nondurables, short: c_other_nondurables}
  c_food_off_premises:     {record: c_food_off_premises, short: c_food_off_premises}
  c_gasoline:              {record: c_gasoline, short: c_gasoline}
  c_housing_utilities:     {record: c_housing_utilities, short: c_housing_utilities}
  c_other_services_health: {record: c_other_services_health, short: c_other_services_health}
  # The people in non-filer units, counted on the CPS units of the training table by the file's own rule
  # (target_list.cps_nonfiler_people, weighted by each unit's chance of not filing): heads and spouses by their own
  # exact age; children under 17 among the head, the spouse and the three dependents the file carries (the youngest
  # three). The filing stage calibration's own numbers, by the head's band and every child, are kept as a check in
  # each target's source.
  heads_spouses_18_25:     {people: {members: [head, spouse], from: 18, to: 26}, label: heads and spouses aged 18_25, filing_band: '18_25'}
  heads_spouses_26_34:     {people: {members: [head, spouse], from: 26, to: 35}, label: heads and spouses aged 26_34, filing_band: '26_34'}
  heads_spouses_35_44:     {people: {members: [head, spouse], from: 35, to: 45}, label: heads and spouses aged 35_44, filing_band: '35_44'}
  heads_spouses_45_54:     {people: {members: [head, spouse], from: 45, to: 55}, label: heads and spouses aged 45_54, filing_band: '45_54'}
  heads_spouses_55_64:     {people: {members: [head, spouse], from: 55, to: 65}, label: heads and spouses aged 55_64, filing_band: '55_64'}
  heads_spouses_65_74:     {people: {members: [head, spouse], from: 65, to: 75}, label: heads and spouses aged 65_74, filing_band: '65_74'}
  heads_spouses_75_up:     {people: {members: [head, spouse], from: 75, to: null}, label: heads and spouses aged 75p, filing_band: '75p'}
  children_under_17:
    people: {members: [head, spouse, dep1, dep2, dep3], from: 0, to: 17}
    label: children under 17
    filing_band: children under 17

# Business families: each gives two variables, <family>_net_income and <family>_net_loss, short name
# "<family> net_income" / "<family> net_loss", SOI lines <family>_net_income / <family>_net_loss in targets/soi.csv.
# Their PUF parts and SOI line names are targets.FAMILIES; they are not repeated here.
families: [sch_c, pship_scorp, rent_royalty, estate_trust, farm, farm_rental]

# Named lists of variables, so an entry can say "the income items".
variable_lists:
  income_items: [wages, taxable_interest, ordinary_dividends, sch_d_net_capital_gain]
  business: [sch_c_net_income, sch_c_net_loss, pship_scorp_net_income, pship_scorp_net_loss,
             rent_royalty_net_income, rent_royalty_net_loss, estate_trust_net_income, estate_trust_net_loss,
             farm_net_income, farm_net_loss, farm_rental_net_income, farm_rental_net_loss]
  # The business families targeted in the five top AGI brackets (TARGETS.md S2), and the rest, which keep one
  # "$1m and over" group: their top cells are small (in 2019 SOI folds farm net income and farm rental net loss at
  # $1M and over into the $500,000-$1,000,000 cell) and S2 does not ask for them.
  business_top: [sch_c_net_income, sch_c_net_loss, pship_scorp_net_income, pship_scorp_net_loss]
  business_other: [rent_royalty_net_income, rent_royalty_net_loss, estate_trust_net_income, estate_trust_net_loss,
                   farm_net_income, farm_net_loss, farm_rental_net_income, farm_rental_net_loss]
  consumption: [c_clothing, c_motor_vehicles, c_durables, c_other_nondurables, c_food_off_premises,
                c_gasoline, c_housing_utilities, c_other_services_health]
  nonfiler_people: [heads_spouses_18_25, heads_spouses_26_34, heads_spouses_35_44, heads_spouses_45_54,
                    heads_spouses_55_64, heads_spouses_65_74, heads_spouses_75_up, children_under_17]
  # The SCF's balance sheet by kind of asset, for the top net worth lines (TARGETS.md S2)
  scf_top_assets: [stocks, business_equity, real_estate, retirement_accounts]
  # Table 1.3's items with a count and an amount (AGI has its amount only), and Table 4.3's (27 October, run G2)
  soi_1_3_items: [wages, taxable_interest, ordinary_dividends, tax_exempt_interest, state_refunds, alimony,
                  sch_c_net_income, sch_c_net_loss, capital_gain_positive, capital_gain_loss, other_gains, ira_taxable,
                  pensions_taxable, ss_taxable, unemployment, rent_royalty_net_income, rent_royalty_net_loss,
                  pship_scorp_net, estate_trust_net, farm_net, farm_rental_net, total_income]
  soi_4_3_items: [wages, taxable_interest, ordinary_dividends, capital_gain_total, sch_cf_positive, sch_cf_loss,
                  pship_scorp_net_income, pship_scorp_net_loss]
  # Auto loan interest from the SCF: the share of units with any and the dollars per unit
  auto_loans: [any_auto_loan_interest, auto_loan_interest]

# ---------------------------------------------------------------------------------------------------------------
# Groupings: named ways of cutting units into cells. An entry's cells are "all", one grouping (all its cells or a
# list of their labels), or several groupings crossed. A cell's label in a target's key is the grouping's label.
#   edges:         dollar ranges [low, high, label] of a variable, low inclusive, null for no limit
#   as_published:  the published table's own AGI brackets in the target year, the top ones merged until each would
#                  hold enough records (merge_top_until); brackets whose lower edge is listed in kept_separate are
#                  never merged (each must be published that year), and the merge rule applies to those below them
#   values:        category values [value, label] of a column of the file
#   lines:         units above a line on a variable: [percentile, p, label] (the survey's own weighted percentile)
#                  or [dollars, x, label]; nested, not a partition
# Rules for published cells (not settings; applied to every published value):
#   - a cell SOI left blank and combined into its neighbour is joined to it (targets.published_cells);
#   - with merge_across_published: true, where one published cell crosses the edge between two of our cells, the
#     two are merged for that variable (over all its statistics), labelled "<first> to <second>" (target_list.merge_groups);
#   - a cell published as zero is left out (a reweighting cannot make positive contributions add to zero);
#   - a cell no record of the starting file can reach is left out, never forced.
# ---------------------------------------------------------------------------------------------------------------
groupings:
  soi_agi_brackets:
    variable: agi
    as_published: soi 1.4
    merge_top_until: {records: 500, in_a_file_of: 200000}
    # The five top brackets, $1M-1.5M, $1.5M-2M, $2M-5M, $5M-10M and $10M and over, each its own cell (TARGETS.md
    # S2). The merge rule would join them into one "$1,000,000 or more" cell (in 2019 the $10M+ bracket is 20,876
    # returns, 26 records in a 200,000-record file); generation, with the AGI group drawn first (qgroups.py), puts
    # thousands of records there.
    kept_separate: [1000000, 1500000, 2000000, 5000000, 10000000]
  soi_1_7_agi_brackets:
    variable: agi
    as_published: soi 1.7
    merge_top_until: {records: 500, in_a_file_of: 200000}
    what: >-
      Table 1.7's AGI brackets, the top ones merged until each would hold 500 records in a 200,000-record file of
      filers (the bracket's share of all Table 1.4 returns, times 200,000): the IRS brackets' rule
  business_agi_groups:
    variable: agi
    merge_across_published: true
    edges:
      - [null, 1, no AGI]
      - [1, 50000, under $50k]
      - [50000, 100000, $50k-100k]
      - [100000, 200000, $100k-200k]
      - [200000, 1000000, $200k-1m]
      - [1000000, null, $1m and over]
  business_agi_groups_top:
    variable: agi
    merge_across_published: true
    what: >-
      the business groups with "$1m and over" cut into SOI's five top brackets (TARGETS.md S2), for the families in
      business_top; groups below $1M are the same as business_agi_groups', so no cell is targeted twice
    edges:
      - [null, 1, no AGI]
      - [1, 50000, under $50k]
      - [50000, 100000, $50k-100k]
      - [100000, 200000, $100k-200k]
      - [200000, 1000000, $200k-1m]
      - [1000000, 1500000, $1m-1.5m]
      - [1500000, 2000000, $1.5m-2m]
      - [2000000, 5000000, $2m-5m]
      - [5000000, 10000000, $5m-10m]
      - [10000000, null, $10m and over]
  # The AGI groups of the W-2 elective deferral targets (Table 2.D; 28 October): the table's AGI rows summed into
  # eight groups, so no cell rests on the table's thin rows below $25,000 or above $1 million.
  w2_agi_groups:
    variable: agi
    edges:
      - [null, 25000, under $25k]
      - [25000, 50000, $25k-50k]
      - [50000, 75000, $50k-75k]
      - [75000, 100000, $75k-100k]
      - [100000, 200000, $100k-200k]
      - [200000, 500000, $200k-500k]
      - [500000, 1000000, $500k-1m]
      - [1000000, null, $1m and over]
  joint_or_not:
    variable: married
    values: [[1, joint], [0, non-joint]]
    in soi 1.2: {joint: [joint], non-joint: [nonjoint]}                       # targets/soi.csv filing_status
    in soi 1.6: {joint: [joint], non-joint: [single, separate, head_of_household]}   # targets.table_1_6 statuses
    # Table 4.B of the W-2 statistics: the column groups of each cell (returns or taxpayers, amount)
    in soi w2: {joint: 'Joint returns, total', non-joint: 'Nonjoint returns, wage earner'}
    in soi w2 2.d: {joint: 'Joint returns, total', non-joint: 'Nonjoint returns, wage earner'}   # Table 2.D's column groups
  # The four filing statuses of Table 1.3 (the file's mars; surviving spouses are in joint returns, as in SOI)
  filing_four:
    variable: mars
    values: [[1, single], [2, joint], [3, separate], [4, head of household]]
    published_column: panel
    published_labels:
      single: [Returns of single persons]
      joint: [Returns of married persons filing jointly and returns of surviving spouses]
      separate: [Returns of married persons filing separately]
      head of household: [Returns of heads of households]
  # Table 4.3's cumulative AGI percentile groups, by AGI rank among returns other than dependent filers' (the
  # file's lines on its starting weights after the demographic prescaling, held fixed in dollars through the tilt,
  # as income_rank_groups). [low percentile, high percentile, label].
  agi_cumulative:
    variable: agi
    ranks:
      - [99.999, 100, top 0.001 percent]
      - [99.99, 100, top 0.01 percent]
      - [99.9, 100, top 0.1 percent]
      - [99, 100, top 1 percent]
      - [95, 100, top 5 percent]
      - [90, 100, top 10 percent]
      - [50, 100, top 50 percent]
    published_column: pctile_group
    published_labels:
      top 0.001 percent: [top 0.001 percent]
      top 0.01 percent: [top 0.01 percent]
      top 0.1 percent: [top 0.1 percent]
      top 1 percent: [top 1 percent]
      top 5 percent: [top 5 percent]
      top 10 percent: [top 10 percent]
      top 50 percent: [top 50 percent]
  married_or_not:
    variable: married
    values: [[1, married], [0, not married]]
    what: a joint unit is married; a separate return is not married, on the survey's units as on the file's
  adult_age_ranges:
    variable: age_range
    values: [[0, under 26], [1, 26-34], [2, 35-44], [3, 45-54], [4, 55-64], [5, 65+]]
  scf_net_worth_lines:
    variable: net_worth
    lines:
      - [percentile, 99.9, above the SCF 99.9th percentile]
      - [percentile, 99, above the SCF 99th percentile]
      - [percentile, 90, above the SCF 90th percentile]
      - [percentile, 50, above the SCF 50th percentile]
      - [dollars, 1000000, above $1 million]
  # Four income groups by the seven shared income items, each side by its own weighted percentiles
  # among the entry's population (the SCF on its own units; the file on its starting weights after the demographic
  # prescaling, then held fixed in dollars through the tilt). [low percentile, high percentile, label], low inclusive.
  income_rank_groups:
    variable: income_7_items
    ranks:
      - [0, 90, income below p90]
      - [90, 99, income p90-99]
      - [99, 99.9, income p99-99.9]
      - [99.9, 100, income p99.9+]
  # Four net worth classes between the SCF's percentile lines in dollars (as scf_net_worth_lines):
  # above the lower line and at or below the upper one. [lower line, upper line, label]; null is no line.
  scf_net_worth_classes:
    variable: net_worth
    bands:
      - [null, [percentile, 90], net worth below SCF p90]
      - [[percentile, 90], [percentile, 99], net worth SCF p90-99]
      - [[percentile, 99], [percentile, 99.9], net worth SCF p99-99.9]
      - [[percentile, 99.9], null, net worth above SCF p99.9]
      # merged classes for the thin cells (historical.yaml, wealth_grid_*): a class resting on fewer than 10 SCF
      # households is merged into the next richer class of the same income group until it has 10 or more
      - [null, [percentile, 99], net worth at or below SCF p99]
      - [null, [percentile, 99.9], net worth at or below SCF p99.9]
