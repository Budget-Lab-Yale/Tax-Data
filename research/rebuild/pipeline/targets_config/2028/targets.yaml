# 2028: the targets of the year's file, written out in full (TARGETS.md section 12). Written on 30 October 2026
# (targets for every year, piece 4 of the overnight plan) by explore/2026-10-30/targets/scripts/make_chain.py; edited
# by hand from here on.
#
# A year after SOI's last tables (2023). The start is the 2023 file (from_year), its weights scaled to 2028's number
# of returns (SOI 2023's returns times CBO's growth in the number of returns) and non-filers (the 2023 CPS's grown
# with the Social Security area population), joint and non-joint returns in 2023's proportions, and every record's
# dollars grown item by item from 2023 to 2028 by growth.yaml (Table 1.4 items past 2023 by CBO's growth per return of
# the closest line; the balance sheet by household net worth per person, the Financial Accounts, past 2025 at a fixed
# ratio to GDP; consumption by PCE per return, past 2025 by CBO's personal income per person).
#
# The targets: (1) the national totals CBO projects (February 2026, calendar years to 2036), each the 2023 file's own
# total times CBO's growth of the closest line from 2023 to 2028 (TARGETS.md section 3: outside information that comes
# only as a change is applied to our own level), a judgment error of 1%; (2) the non-filer count; (3) household net
# worth, the 2023 file's total times the Financial Accounts' growth; (4) hold_distribution: each item's share of its
# total in five AGI rank groups held at the start's, a judgment error of 2% of the share. Nothing else of 2023's
# detail is targeted: the start carries it.
#
# Run of 30 October (scratch explore/2026-10-30/targets/run/2028): 41 targets, every one inside its range; effective
# sample kept 100.0% (the start is grown by the same rates the targets use).
#
# Phase 2 (30 October, evening): weights and dollars as production grows them (explore/2026-10-30/demog/DESIGN.md): the
# start's weights times the population growth of each unit's age x joint cell (filers) or age band (non-filers), no
# scaling to SOI's or CBO's returns; dollars grown per return from CBO's lines (cbo_per_return; an item with no rule
# there keeps growth.yaml's, listed in the run's growth table); targets: the cells exactly, CBO's returns, itemizers and
# AMT counts within 1%, the dollar totals below as before. The earlier 41-target run line above is superseded.
#
# Phase 3 (1 November): CBO's counts of returns, itemizers and AMT returns are no longer CBO's levels: each is the
# previous year's file count times CBO's growth in that count, as the dollar totals already were. Error as before.
#
# Phase 4 (1 November, decision 74): the years are no longer chained. Every projection year starts from the 2023 file
# (from_year 2023), its weights times the population growth from 2023 to the year, its dollars grown per return from 2023 to
# the year by CBO's and the macro series compounded over the years; every target below is the 2023 file's level times the
# cumulative growth from 2023 to the year (the cells exactly; CBO's totals and counts with a judgment error of 1%).

year: 2028
kind: projection
start: {from_year: 2023, run: y2023}
start_scaling: {weights: population_cells, dollars: cbo_per_return}

report:
  - every target with its value, standard error, where the file lands, and the miss in standard errors
  - the hold_distribution shares at the start and after the tilt

hold_distribution:
  population: filers
  ranks: {variable: agi, groups: [[0, 50, p0-50], [50, 90, p50-90], [90, 99, p90-99], [99, 99.9, p99-99.9], [99.9, 100, p99.9+]]}
  items: [agi, wages, taxable_interest, ordinary_dividends, capital_gain_total, business_income]
  statistic: share of total
  error: {kind: judgment, relative: 0.02, reason: 'the distribution of income across AGI rank groups held at the start (TARGETS.md S7); 2% of each share, a judgment'}

targets:

  # Demographic cells (30 October, phase 2; from 2023 since 1 November): the 2023 file's final weighted units in each cell times the cell's
  # population growth, exact (identities); filers by joint status x the primary's age band (nine bands, the three
  # dependent-filer bands included), non-filers by the same bands (the head's age; both joint statuses grow alike).
  - id: population_filers
    kind: demographic filers
    statistic: units
    population: filers
    cells: all
    value: {outside: population cells}
    error: {kind: identity}
    key: {group: '{cell}', target: units}

  - id: population_non_filers
    kind: demographic non-filers
    statistic: units
    population: non_filers
    cells: all
    value: {outside: population cells}
    error: {kind: identity}
    key: {group: '{cell}', target: units}

  # CBO's published counts (February 2026, to 2036) of all returns, itemizers and returns affected by the AMT, anchored to
  # our own level like the totals below (1 November 2026): the 2023 file's count times CBO's growth in that
  # count from 2023 to the year (target_list.cbo_count_rows), within 1% (a judgment; CBO publishes no
  # error). Until 31 October these were CBO's levels, which differ from the file's counts by what a return is (CBO's
  # 2024 count of all returns, 167.1 million, was 2.4% above the file's). The cells above need not add to the count; the
  # miss shows in the fit. The itemizer and AMT counts are the calculator's (itemized deductions claimed; positive AMT),
  # so they join the calculator targets; CBO's AMT count includes some returns whose AMT only limits credits.
  - id: returns_cbo
    kind: cbo counts
    statistic: units
    population: filers
    cells: all
    value: {outside: cbo counts}
    outside_line: rev_iit_returns_total
    error: {kind: judgment, relative: 0.01, reason: 'CBO publishes no error; the 2023 file count times CBO growth in the count from 2023; 1% as a judgment'}
    key: {group: all, target: returns}

  - id: itemizers_cbo
    kind: cbo counts
    statistic: count
    population: filers
    variable: itemized_deductions_claimed
    cells: all
    needs_calculator: true
    value: {outside: cbo counts}
    outside_line: rev_iit_returns_itemized
    error: {kind: judgment, relative: 0.01, reason: 'CBO publishes no error; the 2023 file count times CBO growth in the count from 2023; 1% as a judgment'}
    key: {group: all, target: itemizers}

  - id: amt_cbo
    kind: cbo counts
    statistic: count
    population: filers
    variable: alternative_minimum_tax
    cells: all
    needs_calculator: true
    value: {outside: cbo counts}
    outside_line: rev_iit_returns_amt
    error: {kind: judgment, relative: 0.01, reason: 'CBO publishes no error; the 2023 file count times CBO growth in the count from 2023 (CBO count includes returns whose AMT only limits credits); 1% as a judgment'}
    key: {group: all, target: amt returns}

  # AGI
  - id: agi_cbo
    kind: cbo totals
    statistic: amount
    population: filers
    variable: agi
    cells: all
    value: {outside: cbo individual income tax}
    outside_line: Adjusted gross income
    error: {kind: judgment, relative: 0.01, reason: 'CBO growth applied to our own level; 1% as a judgment (CBO publishes no error)'}
    key: {group: all, target: 'agi amount'}

  # wages
  - id: wages_cbo
    kind: cbo totals
    statistic: amount
    population: filers
    variable: wages
    cells: all
    value: {outside: cbo individual income tax}
    outside_line: Salaries and wages
    error: {kind: judgment, relative: 0.01, reason: 'CBO growth applied to our own level; 1% as a judgment (CBO publishes no error)'}
    key: {group: all, target: 'wages amount'}

  # taxable interest (CBO: taxable interest and dividends other than qualified)
  - id: interest_cbo
    kind: cbo totals
    statistic: amount
    population: filers
    variable: taxable_interest
    cells: all
    value: {outside: cbo individual income tax}
    outside_line: Taxable interest and ordinary dividends
    error: {kind: judgment, relative: 0.01, reason: 'CBO growth applied to our own level; 1% as a judgment (CBO publishes no error)'}
    key: {group: all, target: 'taxable_interest amount'}

  # ordinary dividends (CBO: qualified dividends)
  - id: dividends_cbo
    kind: cbo totals
    statistic: amount
    population: filers
    variable: ordinary_dividends
    cells: all
    value: {outside: cbo individual income tax}
    outside_line: Qualified dividends
    error: {kind: judgment, relative: 0.01, reason: 'CBO growth applied to our own level; 1% as a judgment (CBO publishes no error)'}
    key: {group: all, target: 'ordinary_dividends amount'}

  # capital gains, Form 1040 line 7 (CBO: capital gain or loss, sales of other property included)
  - id: capital_gains_cbo
    kind: cbo totals
    statistic: amount
    population: filers
    variable: capital_gain_total
    cells: all
    value: {outside: cbo individual income tax}
    outside_line: Capital gain or loss
    error: {kind: judgment, relative: 0.01, reason: 'CBO growth applied to our own level; 1% as a judgment (CBO publishes no error)'}
    key: {group: all, target: 'capital_gain_total amount'}

  # business income, Schedules C, E and F (CBO: the same, before the excess business loss limit)
  - id: business_cbo
    kind: cbo totals
    statistic: amount
    population: filers
    variable: business_income
    cells: all
    value: {outside: cbo individual income tax}
    outside_line: Net business income
    error: {kind: judgment, relative: 0.01, reason: 'CBO growth applied to our own level; 1% as a judgment (CBO publishes no error)'}
    key: {group: all, target: 'business_income amount'}

  # taxable pensions, annuities and IRA distributions
  - id: pensions_cbo
    kind: cbo totals
    statistic: amount
    population: filers
    variable: ira_pensions_taxable
    cells: all
    value: {outside: cbo individual income tax}
    outside_line: Taxable pensions and annuities
    error: {kind: judgment, relative: 0.01, reason: 'CBO growth applied to our own level; 1% as a judgment (CBO publishes no error)'}
    key: {group: all, target: 'ira_pensions_taxable amount'}

  # (3 November, John) taxable Social Security benefits are no longer targeted (CBO's taxable benefits line was the
  # target ss_taxable_cbo until then): the file computes them by the section 86 worksheet, as the tax calculator does

  # household net worth, all units below the Forbes line, the start's own total times the Financial Accounts' growth
  - id: net_worth_z1
    kind: z1 wealth
    statistic: amount
    population: scf_units_below_a_billion
    variable: net_worth
    cells: all
    value: {outside: z1 household net worth}
    outside_line: net worth
    error: {kind: judgment, relative: 0.02, reason: 'Financial Accounts growth applied to our own level (households and nonprofits; past 2025 at a fixed ratio to GDP); 2% as a judgment'}
    key: {group: all, target: net worth}

  # Balance-sheet category dollars and holders within each SCF net worth class.
  - id: wealth_categories
    kind: wealth
    statistic: [count, amount]
    population: scf_units_below_a_billion
    variable: scf_wealth_categories
    cells: {scf_net_worth_classes: [net worth below SCF p90, net worth above SCF p90]}
    value: {survey: scf}
    error: {kind: survey_replicate}
    key: {group: '{cell}', target: '{variable} {statistic}'}
