# 2030: how every dollar item is grown from the year it was measured in to another year, one line per item.
# growth.py reads it, and target_list.resolve stops before any run if a dollar item has no line here.
#   source    the series that grows positive values (growth.SERIES; data in resources/growth/), or "none: <reason>";
#   negative  how negative values are grown: same (the same series), another series, or "none: <reason>";
#   measure   what the series is per: per return with the item, per holder, per household, a price;
#   reason    one line.
# Every source is exogenous to tax policy: a series on the underlying spending or tax, per holder where a clean one
# exists, else per household, else AGI per return as a rough prior. SOI's itemized deduction tables are not used, as
# the 2017 law moved their totals and means. See FEATURES.md, "Dollars in the target year".
# Past a series' last year the pipeline extends it: Table 1.4 items by CBO's growth per return of the closest line,
# the direct series by personal income per person, PCE by CBO's personal income per person.

year: 2030
items:

  # ---- PUF amounts (build_table.PUF_AMOUNTS) ------------------------------------------------------------------
  wages:
    source: {series: soi 1.4, item: wages}
    negative: same
    measure: 'dollars per return with the item (SOI Table 1.4, all returns: its amount over its number of returns)'
    reason: 'SOI Table 1.4 publishes the item; grown per return with it'
  txbl_int:
    source: {series: soi 1.4, item: txbl_int}
    negative: same
    measure: 'dollars per return with the item (SOI Table 1.4, all returns: its amount over its number of returns)'
