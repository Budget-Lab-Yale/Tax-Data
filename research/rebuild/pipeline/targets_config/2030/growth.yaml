    source: {series: soi 1.4, item: sch_d_net_gain}
    negative: same
    measure: 'dollars per return with a Schedule D net gain (SOI Table 1.4)'
    reason: 'gains and losses grow with Schedule D net gain per return with one: the losses are the Schedule D losses before the $3,000 limit, which move with asset prices as the gains do; the limit, nominal and not indexed, is applied where AGI is made (common.allowed_capital_gain) and by the calculator'
