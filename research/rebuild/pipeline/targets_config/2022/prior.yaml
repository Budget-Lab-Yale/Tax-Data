# 2022: the prior the year's file is drawn under: the SCF waves and CEX, CPS and SIPP years each record is drawn
# from, with their shares, which the SCF and survey targets use too. Read by generate.py and survey_mix.py. See
# TARGETS.md, "The year's mix of survey years".
# SCF shares for 2022 (the next wave at or after the year and the waves before it): weights exp(-|2022 - t| / 2)
# over the waves' income years t = 2024, 2021, 2018, 2015, 2012 give 0.3679, 0.6065, 0.1353, 0.0302, 0.0067; as
# shares of their sum 32.1%, 52.9%, 11.8%, 2.6%, 0.6%; the 2016 wave (2.6%), the 2013 wave (0.6%) under 5% and
# dropped; the rest rescaled to 54.65%, 33.15%, 12.20% (exactly 0.546549, 0.331499, 0.121952; rounded so they sum to
# 1).
# CEX, CPS and SIPP shares for 2022 (an even year takes the years either side): weights exp(-|2022 - t| / 2) over t
# = 2023, 2021 give 0.6065, 0.6065; as shares of their sum 50.00%, 50.00% (exactly 0.500000, 0.500000).

year: 2022
prior:
  puf variables: {puf 2015: 1.0}
  balance sheet: {scf 2022: 0.5465, scf 2025: 0.3315, scf 2019: 0.1220}
  consumption: {cex 2023: 0.5000, cex 2021: 0.5000}
  cps items: {cps 2023: 0.5000, cps 2021: 0.5000}
  sipp tips: {sipp 2023: 0.5000, sipp 2021: 0.5000}
