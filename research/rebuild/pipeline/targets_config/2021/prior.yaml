# 2021: the prior the year's file is drawn under: the SCF waves and CEX, CPS and SIPP years each record is drawn
# from, with their shares, which the SCF and survey targets use too. Read by generate.py and survey_mix.py. See
# TARGETS.md, "The year's mix of survey years".
# SCF shares for 2021: weights exp(-|2021 - t| / 2) over the waves' income years t = 2021, 2018, 2015, 2012 give
# 1.0000, 0.2231, 0.0498, 0.0111; as shares of their sum 77.9%, 17.4%, 3.9%, 0.9%; the 2016 wave (3.9%), the 2013
# wave (0.9%) under 5% and dropped; the rest rescaled to 81.76%, 18.24% (exactly 0.817574, 0.182426; rounded so they
# sum to 1).
# CEX, CPS and SIPP shares for 2021 (an odd year takes its own year and the one two years before): weights
# exp(-|2021 - t| / 2) over t = 2021, 2019 give 1.0000, 0.3679; as shares of their sum 73.11%, 26.89% (exactly
# 0.731059, 0.268941).

year: 2021
prior:
  puf variables: {puf 2015: 1.0}
  balance sheet: {scf 2022: 0.8176, scf 2019: 0.1824}
  consumption: {cex 2021: 0.7311, cex 2019: 0.2689}
  cps items: {cps 2021: 0.7311, cps 2019: 0.2689}
  sipp tips: {sipp 2021: 0.7311, sipp 2019: 0.2689}
