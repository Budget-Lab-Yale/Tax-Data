# 2070: the targets of a projection year. projection_steps.py builds the start in two steps: step 1 calibrates the
# start file's weights to exact people by marital status and single year of age and to the dependent filers' six
# cells; step 2 multiplies each dollar item by one factor so that its total grows exactly at its series (the items
# table, settings tilt.projection.items_table). Step 3 is the reweighting to the targets below. See FEATURES.md,
# "Projection years".
# The start below names the 2023 file; as a year after the jump-off year, the year starts from the jump-off year's
# file instead (projection_steps.jump_off).
# Past CBO's last projection year every series continues at its long-run aggregate.

year: 2070
kind: projection
start: {from_year: 2023, run: y2023}
start_scaling: {weights: persons, dollars: item_factor}

report:
  - every target with its value, standard error, where the file lands, and the miss in standard errors

targets:

  # Step 1's people by marital status and single year of age (0-79, 80 and over), exact
  - id: persons_by_age
    kind: projection persons
    statistic: amount
    population: all_units
    cells: all
    value: {outside: projection persons}
    error: {kind: identity}
    key: {group: '{cell}', target: people}

  # Returns, indexed: in each group of the primary's age band (under 20, 5-year bands, 80 and over; dependent
  # filers by age range) and marital status, the start file's share of the group's units that file times the
  # group's units after step 1; exact. CBO's count of returns is not used.
  - id: returns_indexed
    kind: projection returns
    statistic: amount
    population: all_units
    cells: all
    value: {outside: projection returns}
    error: {kind: identity}
    key: {group: '{cell}', target: returns}

  # Step 2's dollar totals: every targeted item of the items table, gains and losses separately, at the start's
  # total grown by the item's series; the error is the item's in the table
  - id: item_totals
    kind: projection items
    statistic: amount
    population: all_units
    cells: all
    value: {outside: projection items}
    error: {kind: judgment, relative: 0.01, reason: 'the item total grown by its series; 1% as a judgment (the items table holds the error of each item)'}
    key: {group: '{cell}', target: amount}

  # AMT payers, indexed: the start file's count times CBO's growth in the count, error 5%; no row past CBO's last
  # year. No itemizer count target: the calculator decides who itemizes, and the count is reported against CBO's
  # as a check
  - id: amt_cbo
    kind: cbo counts
    statistic: count
    population: filers
    variable: alternative_minimum_tax
    cells: all
    needs_calculator: true
    value: {outside: cbo counts}
    outside_line: rev_iit_returns_amt
    error: {kind: judgment, relative: 0.05, reason: 'the 2023 file count times CBO growth in the count from 2023; 5% (John, 3 November)'}
    key: {group: all, target: amt returns}

  # Household net worth: the start's level grown by the Financial Accounts' growth
  - id: net_worth_z1
    kind: z1 wealth
    statistic: amount
    population: scf_units_below_a_billion
    variable: net_worth
    cells: all
    value: {outside: z1 household net worth}
    outside_line: net worth
    error: {kind: judgment, relative: 0.02, reason: 'Financial Accounts growth applied to our own level (households and nonprofits; past 2025 at a fixed ratio to GDP); 2% as a judgment'}
    key: {group: all, target: net worth}

  # The balance-sheet categories' dollars and holders within each SCF net worth class
  - id: wealth_categories
    kind: wealth
    statistic: [count, amount]
    population: scf_units_below_a_billion
    variable: scf_wealth_categories
    cells: {scf_net_worth_classes: [net worth below SCF p90, net worth above SCF p90]}
    value: {survey: scf}
    error: {kind: survey_replicate}
    key: {group: '{cell}', target: '{variable} {statistic}'}
