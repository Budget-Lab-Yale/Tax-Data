# 2051: the prior the year's file is drawn under: the PUF year, and the SCF waves and CEX, CPS and SIPP years each
# record is drawn from, with their shares. Read by generate.py and survey_mix.py; the SCF and survey targets use the
# same waves, years and shares. Each share comes from weights exp(-|year - t| / 2) over the survey years t, those
# under 5% dropped and the rest rescaled. See TARGETS.md, "The year's mix of survey years".
# SCF shares for 2051 (past the last wave, income year 2024: the mix of 2024, fixed): weights exp(-|2024 - t| / 2)
# over the waves' income years t = 2024, 2021, 2018, 2015, 2012 give 1.0000, 0.2231, 0.0498, 0.0111, 0.0025; as
# shares of their sum 77.7%, 17.3%, 3.9%, 0.9%, 0.2%; the 2019 wave (3.9%), the 2016 wave (0.9%), the 2013 wave
# (0.2%) under 5% and dropped; the rest rescaled to 81.76%, 18.24% (exactly 0.817574, 0.182426; rounded so they sum
# to 1).
# CEX, CPS and SIPP shares for 2023 (an odd year takes its own year and the one two years before): weights
# exp(-|2023 - t| / 2) over t = 2023, 2021 give 1.0000, 0.3679; as shares of their sum 73.11%, 26.89% (exactly
# 0.731059, 0.268941).
# The PUF variables are drawn under the PUF 2015 label in every year (the only PUF year).
# Past the last SCF wave and survey year the mix stays fixed. A year that starts from an earlier year's file draws
# nothing, so generation does not read this prior; the targets do.

year: 2051
prior:
  puf variables: {puf 2015: 1.0}
  balance sheet: {scf 2025: 0.8176, scf 2022: 0.1824}
  consumption: {cex 2023: 0.7311, cex 2021: 0.2689}
  cps items: {cps 2023: 0.7311, cps 2021: 0.2689}
  sipp tips: {sipp 2023: 0.7311, sipp 2021: 0.2689}
