# 2018: the prior the year's file is drawn under: the SCF waves and CEX, CPS and SIPP years each record is drawn
# from, with their shares, which the SCF and survey targets use too. Read by generate.py and survey_mix.py. See
# TARGETS.md, "The year's mix of survey years".
# SCF shares for 2018: weights exp(-|2018 - t| / 2) over the waves' income years t = 2018, 2015, 2012 give 1.0000,
# 0.2231, 0.0498; as shares of their sum 78.6%, 17.5%, 3.9%; the 2013 wave (3.9%) under 5% and dropped; the rest
# rescaled to 81.76%, 18.24% (exactly 0.817574, 0.182426; rounded so they sum to 1).
# CEX, CPS and SIPP shares for 2018 (an even year takes the years either side): weights exp(-|2018 - t| / 2) over t
# = 2019, 2017 give 0.6065, 0.6065; as shares of their sum 50.00%, 50.00% (exactly 0.500000, 0.500000).

year: 2018
prior:
  puf variables: {puf 2015: 1.0}
  balance sheet: {scf 2019: 0.8176, scf 2016: 0.1824}
  consumption: {cex 2019: 0.5000, cex 2017: 0.5000}
  cps items: {cps 2019: 0.5000, cps 2017: 0.5000}
  sipp tips: {sipp 2019: 0.5000, sipp 2017: 0.5000}
