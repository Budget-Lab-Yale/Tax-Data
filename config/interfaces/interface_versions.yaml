---

#------------
# Model info
#------------

Tax-Data: 
  type: model_data
  version: 1

# The per-year state split of each record's national weight, published by
# src/main_state_weights.R (its own entry point: the fit reads a Tax-Simulator
# baseline run on the Tax-Data vintage, so it cannot live in main.R -- S30,
# S42). `produced: true` tells resolve_interfaces() this is an output, not a
# dependency for any runscript to pin.
State-Weights:
  type: model_data
  version: 1
  produced: true

#-----------------
# Dependency info
#-----------------

IRS-PUF:
  type: raw_data
  version: 1
  
# The constructed non-filer population (Tax-Simulator branch state-tax,
# research/state_weights/nonfiler_pool). Replaces the DINA non-filer append.
ASEC-Nonfilers:
  type: model_data
  version: 1

# DINA STAYS until its second consumer is also retired. impute_nonfilers.R no
# longer reads it, but src/imputations/demographics.R still uses its sex split
# for the filer = 1 cells. Removing the entry before that lands would break a
# pipeline that currently runs.
DINA:
  type: raw_data
  version: 1
  
Compiled-SOI-Tables:
  type: model_data
  version: 2

Macro-Projections: 
  type: model_data
  version: 3
  
CPS-ASEC:
  type: raw_data
  version: 1
  
# CPS-ASEC-Panel removed 2026-08-31: declared here but supplied no vintage by
# any runscript and read by no code, so it resolved to character(0) and wrote
# an all-NA row into dependencies.csv. configure.R now rejects that state
# rather than tolerating it. Re-add with a vintage when a consumer exists.

SCF:
  type: raw_data
  version: 1

# The Tax-Simulator baseline the state-weights split reads calculated AGI and
# EITC from -- the two-pass dependency S30 settled (research/state_weights/
# notes/phase4_state_weights_interface.md, 2.1). Pinned only by
# config/runscripts/state_weights.yaml; main.R never reads it. The key is the
# name Tax-Simulator publishes under, so the path resolves without a special
# case; the pinned vintage's own dependencies.csv must name the Tax-Data
# vintage being split (src/state_weights_contract.R).
Tax-Simulator:
  type: model_data
  version: 1

SIPP:
  type: raw_data
  version: 1

